<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Jankyard Wars</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
      color: #c8e0f0;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    #canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ── Build UI overlay ────────────────────────────────────────────── */
    #build-ui {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      pointer-events: none;
    }
    #build-ui.active { display: block; }

    /* Block palette (left sidebar) */
    #build-palette {
      position: fixed;
      left: 0; top: 0; bottom: 0;
      width: 76px;
      background: rgba(0,8,20,0.92);
      border-right: 1px solid #1a3050;
      overflow-y: auto;
      overflow-x: hidden;
      pointer-events: all;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 4px;
      gap: 4px;
    }

    .palette-block {
      width: 64px; height: 72px;
      border: 2px solid #1a3050;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      line-height: 1.3;
      color: #7090b0;
      background: rgba(0,15,35,0.85);
      flex-shrink: 0;
      user-select: none;
      padding: 4px 2px;
      text-align: center;
    }
    .palette-block:hover  { border-color: #3060a0; color: #a0c0e0; }
    .palette-block.selected {
      border-color: #50a0e0;
      background: rgba(10,40,90,0.92);
      color: #c0e4ff;
    }
    .palette-block canvas { display: block; margin: 0 auto 2px; }

    /* Stats + action panel (top right) */
    #build-actions {
      position: fixed;
      right: 0; top: 0;
      background: rgba(0,8,20,0.92);
      border-left: 1px solid #1a3050;
      border-bottom: 1px solid #1a3050;
      border-bottom-left-radius: 8px;
      padding: 12px 14px;
      pointer-events: all;
      min-width: 200px;
      max-width: 240px;
    }

    #build-title {
      font-size: 13px;
      font-weight: bold;
      color: #80c0ff;
      margin-bottom: 8px;
      border-bottom: 1px solid #1a3050;
      padding-bottom: 6px;
    }

    #build-stats {
      font-size: 11px;
      color: #7090b0;
      line-height: 1.7;
      margin-bottom: 10px;
    }

    #build-hint {
      font-size: 9px;
      color: #405060;
      margin-bottom: 10px;
      line-height: 1.5;
    }

    /* ── Generic button ──────────────────────────────────────────────── */
    .btn {
      display: inline-block;
      padding: 7px 14px;
      border: 1px solid #1a4060;
      border-radius: 5px;
      background: rgba(8,28,58,0.9);
      color: #80b0d0;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      margin: 3px 2px;
      user-select: none;
      outline: none;
      transition: background 0.1s, border-color 0.1s, color 0.1s;
    }
    .btn:hover        { background: rgba(15,50,100,0.9); border-color: #3080c0; color: #b0d8ff; }
    .btn.primary      { border-color: #206040; color: #60e090; }
    .btn.primary:hover{ background: rgba(10,50,25,0.9); border-color: #40c070; color: #90ffb0; }
    .btn.danger       { border-color: #602010; color: #e07050; }
    .btn.danger:hover { background: rgba(70,15,5,0.9);  border-color: #c04030; }

    /* ── DOM overlays ────────────────────────────────────────────────── */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      background: rgba(0,5,14,0.93);
      overflow: auto;
    }
    .overlay.active { display: flex; flex-direction: column; }

    /* Craft UI */
    #craft-ui {
      padding: 24px 20px;
      flex: 1;
    }
    #craft-ui h2 {
      color: #60b0ff;
      font-size: 18px;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1a3050;
    }

    .recipe-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    .recipe-card {
      background: rgba(0,10,25,0.95);
      border: 1px solid #1a3050;
      border-radius: 8px;
      padding: 12px;
      width: 156px;
      cursor: default;
      transition: border-color 0.15s;
    }
    .recipe-card.can-craft { border-color: #1a4a2a; }
    .recipe-card.can-craft:hover { border-color: #40a060; }

    .recipe-name {
      font-size: 12px;
      font-weight: bold;
      color: #a0c8e8;
      margin-bottom: 5px;
    }
    .recipe-cost {
      font-size: 10px;
      color: #5080a0;
      line-height: 1.6;
      margin-bottom: 6px;
    }
    .recipe-count {
      font-size: 10px;
      color: #608060;
      margin-bottom: 8px;
    }

    /* Settings + GameOver */
    #settings-ui, #gameover-ui {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 18px;
    }
    #gameover-ui h1 { color: #ff3020; font-size: 52px; letter-spacing: 4px; }
    #settings-ui h2, #gameover-ui h2 { color: #60a0e0; font-size: 22px; }

    .key-hint-box {
      background: rgba(0,10,25,0.7);
      border: 1px solid #1a3050;
      border-radius: 6px;
      padding: 12px 20px;
      font-size: 12px;
      color: #5080a0;
      line-height: 2;
      max-width: 420px;
      text-align: left;
    }
    .key-hint-box kbd {
      background: rgba(30,60,100,0.7);
      border: 1px solid #2a5080;
      border-radius: 3px;
      padding: 1px 5px;
      font-family: inherit;
      font-size: 11px;
      color: #90c0e0;
    }
  </style>
</head>
<body>

  <!-- Main canvas — all game rendering goes here -->
  <canvas id="canvas"></canvas>

  <!-- ── Build mode UI ──────────────────────────────────────────────────── -->
  <div id="build-ui">
    <div id="build-palette"><!-- populated by BuildUI.js --></div>

    <div id="build-actions">
      <div id="build-title">🔧 建造モード</div>
      <div id="build-stats"><!-- populated by BuildUI.js --></div>
      <div id="build-hint">
        左クリック: ブロック配置<br>
        右クリック: ブロック削除
      </div>
      <button class="btn primary" id="btn-build-done">完了 [B]</button>
      <button class="btn danger"  id="btn-build-clear">全削除</button>
    </div>
  </div>

  <!-- ── Craft overlay ─────────────────────────────────────────────────── -->
  <div class="overlay" id="craft-overlay">
    <div id="craft-ui">
      <h2>⚗️ クラフト</h2>
      <div class="recipe-grid" id="recipe-grid">
        <!-- populated by CraftUI.js -->
      </div>
      <button class="btn" id="btn-craft-close">閉じる [C]</button>
    </div>
  </div>

  <!-- ── Settings overlay ─────────────────────────────────────────────── -->
  <div class="overlay" id="settings-overlay">
    <div id="settings-ui">
      <h2>⚙️ 設定</h2>
      <div class="key-hint-box">
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / 矢印キー — 推力・回転<br>
        <kbd>クリック</kbd> — 武器発射（マウス方向に照準）<br>
        <kbd>E</kbd> or <kbd>Space</kbd> — ドリル（近くの小惑星を採掘）<br>
        <kbd>B</kbd> — 建造モード切替<br>
        <kbd>C</kbd> — クラフト画面<br>
        <kbd>Esc</kbd> — この設定画面
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
        <button class="btn primary" id="btn-settings-save">セーブ（ファイルに保存）</button>
        <button class="btn"         id="btn-settings-load">ロード（ファイルから）</button>
      </div>
      <button class="btn" id="btn-settings-close">ゲームに戻る [Esc]</button>
    </div>
  </div>

  <!-- ── Game Over overlay ─────────────────────────────────────────────── -->
  <div class="overlay" id="gameover-overlay">
    <div id="gameover-ui">
      <h1>GAME OVER</h1>
      <h2>コアブロックが破壊されました</h2>
      <button class="btn primary" id="btn-restart">リスタート</button>
    </div>
  </div>

  <!-- Entry point — ES module, no bundler needed -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
