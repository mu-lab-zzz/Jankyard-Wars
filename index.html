<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Jankyard-Wars — Prototype</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    html,body { margin:0; height:100%; background:#0f0f12; color:#e6eef3; font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; }
    #game-container { width:100%; height:100vh; position: relative; }
    #ui { position: absolute; left:12px; top:12px; z-index: 20; }
    #title { position: absolute; left:50%; transform: translateX(-50%); top:12px; font-weight:700; font-size:1.25rem; }
    #version { margin-left:8px; font-size:0.9rem; color:#9fb0c9; }
    button { margin-right:6px; padding:6px 8px; border-radius:6px; border:0; background:#1f6feb; color:white; cursor:pointer; }
    #modeLabel { margin-left:8px; color:#cfe3ff; }
    #fileInput { display:none; }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="ui">
      <button id="btnMode">Play</button>
      <button id="btnSave">Save</button>
      <button id="btnLoad">Load</button>
      <span id="modeLabel">Mode: Build</span>
      <span id="version">Ver: -</span>
    </div>
    <div id="title">Jankyard-Wars</div>
  </div>

  <input id="fileInput" type="file" accept="application/json" />

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
