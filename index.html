<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Jankyard Wars</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
      color: #c8e0f0;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    #canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #06090f;
    }

    /* ── Build UI overlay ────────────────────────────────────────────── */
    #build-ui {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      pointer-events: none;
    }
    #build-ui.active { display: block; }

    /* Block palette (left sidebar) */
    #build-palette {
      position: fixed;
      left: 0; top: 0; bottom: 0;
      width: 76px;
      background: rgba(0,8,20,0.92);
      border-right: 1px solid #1a3050;
      overflow-y: auto;
      overflow-x: hidden;
      pointer-events: all;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 4px;
      gap: 4px;
    }

    .palette-block {
      width: 64px; height: 72px;
      border: 2px solid #1a3050;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      line-height: 1.3;
      color: #7090b0;
      background: rgba(0,15,35,0.85);
      flex-shrink: 0;
      user-select: none;
      padding: 4px 2px;
      text-align: center;
    }
    .palette-block:hover  { border-color: #3060a0; color: #a0c0e0; }
    .palette-block.selected {
      border-color: #50a0e0;
      background: rgba(10,40,90,0.92);
      color: #c0e4ff;
    }
    .palette-block canvas { display: block; margin: 0 auto 2px; }

    /* Stats + action panel (top right) */
    #build-actions {
      position: fixed;
      right: 0; top: 0;
      background: rgba(0,8,20,0.92);
      border-left: 1px solid #1a3050;
      border-bottom: 1px solid #1a3050;
      border-bottom-left-radius: 8px;
      padding: 12px 14px;
      pointer-events: all;
      min-width: 200px;
      max-width: 240px;
    }

    #build-title {
      font-size: 13px;
      font-weight: bold;
      color: #80c0ff;
      margin-bottom: 8px;
      border-bottom: 1px solid #1a3050;
      padding-bottom: 6px;
    }

    #build-stats {
      font-size: 11px;
      color: #7090b0;
      line-height: 1.7;
      margin-bottom: 10px;
    }

    #build-hint {
      font-size: 9px;
      color: #405060;
      margin-bottom: 10px;
      line-height: 1.5;
    }

    /* ── Generic button ──────────────────────────────────────────────── */
    .btn {
      display: inline-block;
      padding: 7px 14px;
      border: 1px solid #1a4060;
      border-radius: 5px;
      background: rgba(8,28,58,0.9);
      color: #80b0d0;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      margin: 3px 2px;
      user-select: none;
      outline: none;
      transition: background 0.1s, border-color 0.1s, color 0.1s;
    }
    .btn:hover        { background: rgba(15,50,100,0.9); border-color: #3080c0; color: #b0d8ff; }
    .btn.primary      { border-color: #206040; color: #60e090; }
    .btn.primary:hover{ background: rgba(10,50,25,0.9); border-color: #40c070; color: #90ffb0; }
    .btn.danger       { border-color: #602010; color: #e07050; }
    .btn.danger:hover { background: rgba(70,15,5,0.9);  border-color: #c04030; }

    /* ── DOM overlays ────────────────────────────────────────────────── */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      background: rgba(0,5,14,0.93);
      overflow: auto;
    }
    .overlay.active { display: flex; flex-direction: column; }

    /* Craft UI */
    #craft-ui {
      padding: 24px 20px;
      flex: 1;
    }
    #craft-ui h2 {
      color: #60b0ff;
      font-size: 18px;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1a3050;
    }

    .recipe-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    .recipe-card {
      background: rgba(0,10,25,0.95);
      border: 1px solid #1a3050;
      border-radius: 8px;
      padding: 12px;
      width: 156px;
      cursor: default;
      transition: border-color 0.15s;
    }
    .recipe-card.can-craft { border-color: #1a4a2a; }
    .recipe-card.can-craft:hover { border-color: #40a060; }

    .recipe-name {
      font-size: 12px;
      font-weight: bold;
      color: #a0c8e8;
      margin-bottom: 5px;
    }
    .recipe-cost {
      font-size: 10px;
      color: #5080a0;
      line-height: 1.6;
      margin-bottom: 6px;
    }
    .recipe-count {
      font-size: 10px;
      color: #608060;
      margin-bottom: 8px;
    }

    /* Settings + GameOver */
    #settings-ui, #gameover-ui {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 18px;
    }
    #gameover-ui h1 { color: #ff3020; font-size: 52px; letter-spacing: 4px; }
    #settings-ui h2, #gameover-ui h2 { color: #60a0e0; font-size: 22px; }

    .key-hint-box {
      background: rgba(0,10,25,0.7);
      border: 1px solid #1a3050;
      border-radius: 6px;
      padding: 12px 20px;
      font-size: 12px;
      color: #5080a0;
      line-height: 2;
      max-width: 420px;
      text-align: left;
    }
    .key-hint-box kbd {
      background: rgba(30,60,100,0.7);
      border: 1px solid #2a5080;
      border-radius: 3px;
      padding: 1px 5px;
      font-family: inherit;
      font-size: 11px;
      color: #90c0e0;
    }

    /* ── Station UI ───────────────────────────────────────────────────── */
    #station-ui {
      padding: 20px 18px;
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
    }
    #station-ui h2 {
      color: #40d0ff;
      font-size: 18px;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid #1a3050;
    }

    .station-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 14px;
      border-bottom: 1px solid #1a3050;
      padding-bottom: 8px;
      flex-wrap: wrap;
    }
    .station-tab-btn {
      padding: 6px 16px;
      border: 1px solid #1a3050;
      border-radius: 4px 4px 0 0;
      background: rgba(0,10,25,0.8);
      color: #507090;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      transition: background 0.1s, color 0.1s;
    }
    .station-tab-btn.active {
      background: rgba(10,40,80,0.9);
      color: #60c0ff;
      border-color: #2a6090;
    }
    .station-tab-btn:hover { color: #90c0e0; }

    .station-panel { padding: 10px 0; }
    .station-panel.hidden { display: none; }

    .section-title {
      font-size: 11px;
      color: #405870;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 12px 0 8px;
    }

    #station-cargo-info .stat-row,
    #station-dock-info  .stat-row {
      font-size: 12px;
      color: #7090b0;
      margin-bottom: 6px;
    }
    #station-cargo-info .ore-row { font-size: 11px; margin: 2px 0; }

    .refine-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      padding: 5px 0;
      border-bottom: 1px solid rgba(30,50,80,0.4);
      flex-wrap: wrap;
    }
    .refine-row span { min-width: 100px; }
    .refine-row button { font-size: 10px; padding: 4px 10px; }

    #station-mat-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      padding: 8px;
      background: rgba(0,5,15,0.6);
      border-radius: 6px;
      border: 1px solid #1a3050;
      min-height: 32px;
    }
    .mat-chip {
      font-size: 11px;
      background: rgba(10,30,60,0.8);
      border: 1px solid #1a4060;
      border-radius: 4px;
      padding: 3px 8px;
    }

    #btn-deposit-all { margin: 8px 0 6px; }
    #btn-station-close { margin-top: 16px; }
  </style>
</head>
<body>

  <!-- Main canvas — all game rendering goes here -->
  <canvas id="canvas"></canvas>

  <!-- ── Build mode UI ──────────────────────────────────────────────────── -->
  <div id="build-ui">
    <div id="build-palette"><!-- populated by BuildUI.js --></div>

    <div id="build-actions">
      <div id="build-title">🔧 建造モード</div>
      <div id="build-stats"><!-- populated by BuildUI.js --></div>
      <div id="build-hint">
        左クリック: ブロック配置<br>
        右クリック: ブロック削除
      </div>
      <button class="btn primary" id="btn-build-done">完了 [B]</button>
      <button class="btn danger"  id="btn-build-clear">全削除</button>
    </div>
  </div>

  <!-- ── Station overlay ──────────────────────────────────────────────── -->
  <div class="overlay" id="station-overlay">
    <div id="station-ui">
      <h2>🛸 宇宙ステーション</h2>

      <!-- Tab buttons -->
      <div class="station-tabs">
        <button class="station-tab-btn active" data-tab="refine">搬入・精製</button>
        <button class="station-tab-btn"        data-tab="craft">パーツ製造</button>
        <button class="station-tab-btn"        data-tab="dock">ドック</button>
      </div>

      <!-- Tab: Deposit & Refine -->
      <div class="station-panel" id="station-panel-refine">
        <div id="station-cargo-info"></div>
        <button class="btn primary" id="btn-deposit-all">全積荷を搬入</button>
        <div id="station-ore-list"></div>
      </div>

      <!-- Tab: Craft -->
      <div class="station-panel hidden" id="station-panel-craft">
        <div id="station-mat-list"></div>
        <div class="recipe-grid" id="station-recipe-grid"></div>
      </div>

      <!-- Tab: Dock -->
      <div class="station-panel hidden" id="station-panel-dock">
        <div id="station-dock-info"></div>
        <p style="color:#608090;margin:12px 0">ドックに接続中。ブロックの追加・取り外しができます。</p>
        <button class="btn primary" id="btn-enter-build">🔧 建造モードに入る</button>
      </div>

      <button class="btn" id="btn-station-close">🚀 出発する</button>
    </div>
  </div>

  <!-- ── Settings overlay ─────────────────────────────────────────────── -->
  <div class="overlay" id="settings-overlay">
    <div id="settings-ui">
      <h2>⚙️ 設定</h2>
      <div class="key-hint-box">
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / 矢印キー — 推力・回転<br>
        <kbd>クリック</kbd> / 右タップ — 武器発射<br>
        <kbd>E</kbd> / <kbd>Space</kbd> — ドリル採掘 / ステーションドック<br>
        <kbd>B</kbd> — 建造モード（ドック時のみ）<br>
        <kbd>Esc</kbd> — この設定画面<br>
        左スワイプ — 移動ジョイスティック（スマホ）
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
        <button class="btn primary" id="btn-settings-save">セーブ（ファイルに保存）</button>
        <button class="btn"         id="btn-settings-load">ロード（ファイルから）</button>
      </div>
      <button class="btn" id="btn-settings-close">ゲームに戻る [Esc]</button>
    </div>
  </div>

  <!-- ── Game Over overlay ─────────────────────────────────────────────── -->
  <div class="overlay" id="gameover-overlay">
    <div id="gameover-ui">
      <h1>GAME OVER</h1>
      <h2>コアブロックが破壊されました</h2>
      <button class="btn primary" id="btn-restart">リスタート</button>
    </div>
  </div>

  <!-- Entry point — ES module, no bundler needed -->
  <script>
// Jankyard Wars — bundled single-file build
"use strict";

// ═══ src/constants.js ═══
// src/constants.js — game-wide constants and tuning values

const BS = 32;             // block size in world pixels
const FIXED_DT = 1 / 60;  // physics step (seconds)
const MAX_DT   = 0.05;    // delta-time clamp
const DRAG     = 0.984;   // linear velocity damping per frame
const ANG_DRAG = 0.88;    // angular velocity damping per frame
const CAMERA_LERP = 0.1;  // camera smoothing factor

const BULLET_SPEED  = 480;  // world px/s
const BULLET_LIFE   = 2.5;  // seconds

const CHUNK_BLOCKS = 16;
const CHUNK_PX     = BS * CHUNK_BLOCKS; // 512
const ACTIVE_RADIUS_CHUNKS = 3;

const ASTEROID_DENSITY      = 0.12;
const ASTEROIDS_PER_CHUNK   = 5;
const ENEMY_DENSITY         = 0.06;
const ENEMIES_PER_CHUNK     = 1;
const ENEMY_DESPAWN_DIST    = 2200;
const ASTEROID_DESPAWN_DIST = 1900;

// ── Cargo ──────────────────────────────────────────────────────────────────
const BASE_CARGO = 20;          // capacity with no container blocks
const PICKUP_RANGE = 80;        // auto-pickup radius

// ── Station ────────────────────────────────────────────────────────────────
const STATION_X = 0;
const STATION_Y = 0;
const STATION_DOCK_RANGE = 350; // world px to show dock button
const STATION_INNER_RANGE = 160;// world px for auto-dock collision

// ── Raw ores (from asteroids, stored in ship cargo) ────────────────────────
const ORE = Object.freeze({
  IRON:        'iron_ore',
  COPPER:      'copper_ore',
  CRYSTAL:     'crystal_shard',
  TITANIUM:    'titanium_ore',
  DARK_MATTER: 'dark_matter',
});

// Cargo weight per 1 unit of ore
const ORE_WEIGHT = Object.freeze({
  iron_ore:     1,
  copper_ore:   1,
  crystal_shard:2,
  titanium_ore: 2,
  dark_matter:  1,
});

// ── Processed materials (refined at station) ───────────────────────────────
const MAT = Object.freeze({
  IRON_PLATE:     'iron_plate',
  COPPER_WIRE:    'copper_wire',
  CRYSTAL_LENS:   'crystal_lens',
  TITANIUM_ALLOY: 'titanium_alloy',
  ENERGY_CELL:    'energy_cell',
});

// ── Block type ids ─────────────────────────────────────────────────────────
const BID = Object.freeze({
  CORE:        'core',
  ARMOR:       'armor',
  ENGINE:      'engine',
  WEAPON:      'weapon',
  DRILL:       'drill',
  CONTAINER:   'container',
  GENERATOR:   'generator',
  BATTERY:     'battery',
  SHIELD:      'shield',
  RADAR:       'radar',
  DRONE_HATCH: 'drone_hatch',
});

// ── Screen ids ─────────────────────────────────────────────────────────────
const SCREEN = Object.freeze({
  GAME:     'game',
  BUILD:    'build',
  STATION:  'station',
  SETTINGS: 'settings',
  GAMEOVER: 'gameover',
});

// ── Enemy AI ────────────────────────────────────────────────────────────────
const AI = Object.freeze({
  PATROL: 0,
  SEEK:   1,
  CHASE:  2,
  ATTACK: 3,
  FLEE:   4,
});

// ── Star field ─────────────────────────────────────────────────────────────
const STAR_COUNT   = 250;
const STAR_VIRTUAL = 3072;

// ── Pre-allocated colour strings ───────────────────────────────────────────
const C = Object.freeze({
  BG:          '#06090f',
  STAR_DIM:    '#404868',
  STAR_MED:    '#8890b8',
  STAR_BRIGHT: '#dde8ff',
  HP_BAR:      '#40e060',
  HP_LOW:      '#e04020',
  SHIELD_BAR:  '#4080ff',
  CARGO_BAR:   '#e0a020',
  CARGO_FULL:  '#e04020',
  HUD_BG:      'rgba(0,6,16,0.75)',
  HUD_BORDER:  '#1a3050',
  WHITE:       '#ffffff',
  YELLOW:      '#ffe060',
  ORANGE:      '#ff9020',
  RED:         '#ff3020',
  BULLET_PLR:  '#ffe080',
  BULLET_ENM:  '#ff5030',
  // Ore colours
  ORE_IRON:        '#a0b8c8',
  ORE_COPPER:      '#e07830',
  ORE_CRYSTAL:     '#60d8ff',
  ORE_TITANIUM:    '#c0c8e0',
  ORE_DARK_MATTER: '#d060ff',
  // Material colours
  MAT_PLATE:  '#c8d8e0',
  MAT_WIRE:   '#f0a050',
  MAT_LENS:   '#80e8ff',
  MAT_ALLOY:  '#e0e8ff',
  MAT_CELL:   '#e080ff',
  // Station
  STATION_RANGE: 'rgba(60,200,100,0.15)',
  DOCK_ACTIVE:   '#40e080',
});

// ═══ src/utils/Math2D.js ═══
// src/utils/Math2D.js — allocation-free 2D math helpers

function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }

function dist2(ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  return dx * dx + dy * dy;
}
function dist(ax, ay, bx, by) { return Math.sqrt(dist2(ax, ay, bx, by)); }
function len2(x, y) { return x * x + y * y; }
function len(x, y) { return Math.sqrt(x * x + y * y); }

// Rotate point (x, y) by angle (precomputed cos/sin)
function rotX(x, y, cos, sin) { return x * cos - y * sin; }
function rotY(x, y, cos, sin) { return x * sin + y * cos; }

function angleTo(ax, ay, bx, by) { return Math.atan2(by - ay, bx - ax); }

// Normalise angle to [-PI, PI]
function normAngle(a) {
  const PI2 = Math.PI * 2;
  a = a % PI2;
  if (a >  Math.PI) a -= PI2;
  if (a < -Math.PI) a += PI2;
  return a;
}

// Shortest signed difference: how much to rotate `from` to reach `to`
function angleDiff(from, to) { return normAngle(to - from); }

// ═══ src/utils/Pool.js ═══
// src/utils/Pool.js — generic object pool (zero GC in steady state)

class Pool {
  constructor(factory, onRelease) {
    this._factory   = factory;
    this._onRelease = onRelease;
    this._free      = [];
    this.activeCount = 0;
  }

  get() {
    const obj = this._free.length > 0 ? this._free.pop() : this._factory();
    obj._pooled = false;
    this.activeCount++;
    return obj;
  }

  release(obj) {
    if (obj._pooled) return;
    obj._pooled = true;
    this._onRelease(obj);
    this._free.push(obj);
    this.activeCount--;
  }

  // Pre-allocate objects so the factory isn't called during gameplay
  prewarm(n) {
    for (let i = 0; i < n; i++) {
      const obj = this._factory();
      obj._pooled = true;
      this._free.push(obj);
    }
  }
}

// ═══ src/utils/SpriteCache.js ═══
// src/utils/SpriteCache.js — cache pre-rendered canvas images (no image files needed)

const _cache = new Map();

function makeCanvas(w, h) {
  if (typeof OffscreenCanvas !== 'undefined') {
    return new OffscreenCanvas(w, h);
  }
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

/**
 * Create and cache a sprite.
 * drawFn(ctx, w, h) — called once at startup to draw the sprite.
 */
function cacheSprite(key, w, h, drawFn) {
  if (_cache.has(key)) return _cache.get(key);
  const canvas = makeCanvas(w, h);
  const ctx    = canvas.getContext('2d');
  drawFn(ctx, w, h);
  _cache.set(key, canvas);
  return canvas;
}

function getSprite(key) { return _cache.get(key) ?? null; }
function hasSprite(key) { return _cache.has(key); }
function clearAll()     { _cache.clear(); }

// ═══ src/utils/PRNG.js ═══
// src/utils/PRNG.js — Xorshift32 seeded PRNG for deterministic world generation

function makePRNG(seed) {
  let s = ((seed | 0) >>> 0) || 1;
  return function () {
    s ^= s << 13;
    s ^= s >>> 17;
    s ^= s << 5;
    return (s >>> 0) / 4294967296;
  };
}

// Mix two integers into a seed (for chunk-based generation)
function hashInt2(a, b) {
  let h = ((a * 1664525 + 1013904223) ^ (b * 214013 + 2531011)) >>> 0;
  h ^= h >>> 16;
  h = (h * 0x85ebca6b) >>> 0;
  h ^= h >>> 13;
  h = (h * 0xc2b2ae35) >>> 0;
  h ^= h >>> 16;
  return h;
}

// ═══ src/engine/Input.js ═══
// src/engine/Input.js — keyboard, mouse, touch input (zero per-frame allocation)

class Input {
  constructor(canvas) {
    this.canvas = canvas;

    // Keyboard state — Object.create(null) avoids prototype chain lookup
    this._keys      = Object.create(null);
    this._justDown  = Object.create(null);

    // Mouse (screen coords)
    this.mouseX = 0;
    this.mouseY = 0;
    this._btnMask     = 0; // bitmask: button0 = left, button1 = middle, button2 = right
    this._justDownBtn = 0;

    // Virtual joystick (touch, left half of screen)
    this.joyX       = 0;  // -1..1
    this.joyY       = 0;
    this._joyId     = -1;
    this.joyOriginX = 0;  // screen position of joystick anchor
    this.joyOriginY = 0;

    // Touch fire (right half)
    this.touchFire  = false;
    this.touchFireX = 0;
    this.touchFireY = 0;
    this._fireId    = -1;

    // Bind handlers once so we can remove them in destroy()
    this._kd = this._onKeyDown.bind(this);
    this._ku = this._onKeyUp.bind(this);
    this._mm = this._onMouseMove.bind(this);
    this._md = this._onMouseDown.bind(this);
    this._mu = this._onMouseUp.bind(this);
    this._ts = this._onTouchStart.bind(this);
    this._tm = this._onTouchMove.bind(this);
    this._te = this._onTouchEnd.bind(this);

    window.addEventListener('keydown', this._kd, false);
    window.addEventListener('keyup',   this._ku, false);
    canvas.addEventListener('mousemove',  this._mm, { passive: true });
    canvas.addEventListener('mousedown',  this._md, false);
    canvas.addEventListener('mouseup',    this._mu, false);
    canvas.addEventListener('touchstart', this._ts, { passive: false });
    canvas.addEventListener('touchmove',  this._tm, { passive: false });
    canvas.addEventListener('touchend',   this._te, false);
    canvas.addEventListener('touchcancel',this._te, false);
  }

  // ---- raw handlers ----
  _onKeyDown(e) {
    if (!this._keys[e.code]) this._justDown[e.code] = true;
    this._keys[e.code] = true;
  }
  _onKeyUp(e) { this._keys[e.code] = false; }

  _canvasPos(clientX, clientY) {
    const r = this.canvas.getBoundingClientRect();
    const sx = this.canvas.width  / r.width;
    const sy = this.canvas.height / r.height;
    return { x: (clientX - r.left) * sx, y: (clientY - r.top) * sy };
  }

  _onMouseMove(e) {
    const p = this._canvasPos(e.clientX, e.clientY);
    this.mouseX = p.x;
    this.mouseY = p.y;
  }
  _onMouseDown(e) { e.preventDefault(); this._btnMask |= 1 << e.button; this._justDownBtn |= 1 << e.button; }
  _onMouseUp(e)   { this._btnMask &= ~(1 << e.button); }

  _onTouchStart(e) {
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      const p = this._canvasPos(t.clientX, t.clientY);
      if (p.x < this.canvas.width * 0.5) {
        if (this._joyId < 0) {
          this._joyId     = t.identifier;
          this.joyOriginX = p.x;
          this.joyOriginY = p.y;
          this.joyX = 0; this.joyY = 0;
        }
      } else {
        if (this._fireId < 0) {
          this._fireId    = t.identifier;
          this.touchFire  = true;
          this.touchFireX = p.x;
          this.touchFireY = p.y;
        }
      }
    }
  }

  _onTouchMove(e) {
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      const p = this._canvasPos(t.clientX, t.clientY);
      if (t.identifier === this._joyId) {
        const dx = p.x - this.joyOriginX;
        const dy = p.y - this.joyOriginY;
        const r  = Math.sqrt(dx * dx + dy * dy);
        const maxR = 50;
        if (r > 0) {
          this.joyX = dx / Math.max(r, maxR);
          this.joyY = dy / Math.max(r, maxR);
        }
      } else if (t.identifier === this._fireId) {
        this.touchFireX = p.x;
        this.touchFireY = p.y;
      }
    }
  }

  _onTouchEnd(e) {
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      if (t.identifier === this._joyId) {
        this._joyId = -1; this.joyX = 0; this.joyY = 0;
      } else if (t.identifier === this._fireId) {
        this._fireId = -1; this.touchFire = false;
      }
    }
  }

  // ---- query API ----
  isDown(code)      { return !!this._keys[code]; }
  justDown(code)    { return !!this._justDown[code]; }
  mouseDown(btn)    { return !!(this._btnMask & (1 << btn)); }
  mouseJustDown(btn){ return !!(this._justDownBtn & (1 << btn)); }

  /** Call once per frame, at the end, to clear just-pressed state. */
  flush() {
    for (const k in this._justDown) delete this._justDown[k];
    this._justDownBtn = 0;
  }

  destroy() {
    window.removeEventListener('keydown', this._kd);
    window.removeEventListener('keyup',   this._ku);
    this.canvas.removeEventListener('mousemove',   this._mm);
    this.canvas.removeEventListener('mousedown',   this._md);
    this.canvas.removeEventListener('mouseup',     this._mu);
    this.canvas.removeEventListener('touchstart',  this._ts);
    this.canvas.removeEventListener('touchmove',   this._tm);
    this.canvas.removeEventListener('touchend',    this._te);
    this.canvas.removeEventListener('touchcancel', this._te);
  }
}

// ═══ src/engine/Camera.js ═══
// src/engine/Camera.js — 2D camera with smooth follow and screen shake

class Camera {
  constructor() {
    this.x  = 0; this.y  = 0;   // current world position of screen centre
    this.tx = 0; this.ty = 0;   // target
    this.zoom = 1;

    this._shake  = 0;
    this._shakeX = 0;
    this._shakeY = 0;
  }

  follow(wx, wy) { this.tx = wx; this.ty = wy; }

  addShake(amount) { if (amount > this._shake) this._shake = amount; }

  update() {
    this.x = lerp(this.x, this.tx, CAMERA_LERP);
    this.y = lerp(this.y, this.ty, CAMERA_LERP);

    if (this._shake > 0.4) {
      this._shakeX = (Math.random() * 2 - 1) * this._shake;
      this._shakeY = (Math.random() * 2 - 1) * this._shake;
      this._shake *= 0.82;
    } else {
      this._shake  = 0;
      this._shakeX = 0;
      this._shakeY = 0;
    }
  }

  /** Apply world transform to ctx so world-space drawing works correctly. */
  apply(ctx) {
    const cw = ctx.canvas.width;
    const ch = ctx.canvas.height;
    ctx.translate(cw * 0.5 + this._shakeX, ch * 0.5 + this._shakeY);
    ctx.scale(this.zoom, this.zoom);
    ctx.translate(-this.x, -this.y);
  }

  // World → screen
  toSX(wx, cw) { return (wx - this.x) * this.zoom + cw * 0.5 + this._shakeX; }
  toSY(wy, ch) { return (wy - this.y) * this.zoom + ch * 0.5 + this._shakeY; }

  // Screen → world
  toWX(sx, cw) { return (sx - cw * 0.5 - this._shakeX) / this.zoom + this.x; }
  toWY(sy, ch) { return (sy - ch * 0.5 - this._shakeY) / this.zoom + this.y; }

  /** Returns true if world-space circle is within the visible area. */
  isVisible(wx, wy, radius, cw, ch) {
    const margin = radius;
    const hw = cw * 0.5 / this.zoom + margin;
    const hh = ch * 0.5 / this.zoom + margin;
    return Math.abs(wx - this.x) < hw && Math.abs(wy - this.y) < hh;
  }
}

function rect(ctx, x, y, w, h, fill, stroke, lw = 1) {
  ctx.fillStyle = fill;
  ctx.fillRect(x, y, w, h);
  if (stroke) {
    ctx.strokeStyle = stroke;
    ctx.lineWidth = lw;
    ctx.strokeRect(x + lw * 0.5, y + lw * 0.5, w - lw, h - lw);
  }
}

function polygon(ctx, pts, fill, stroke, lw = 1) {
  ctx.beginPath();
  ctx.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath();
  if (fill)   { ctx.fillStyle = fill;     ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}

function circle(ctx, cx, cy, r, fill, stroke, lw = 1) {
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  if (fill)   { ctx.fillStyle = fill;     ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}

// ═══ src/blocks/BlockRegistry.js ═══
// src/blocks/BlockRegistry.js — registry of all block types + sprite cache

const _byId = new Map();

for (const def of BLOCK_DEFS) {
  _byId.set(def.id, def);
}

/** Return block definition by id (throws if missing). */
function getDef(id) {
  const d = _byId.get(id);
  if (!d) throw new Error(`Unknown block id: ${id}`);
  return d;
}

/** All registered block ids. */
function allIds() { return _byId.keys(); }

/** All registered defs. */
function allDefs() { return _byId.values(); }

/**
 * Pre-render every block type's sprite into an OffscreenCanvas.
 * Call once at startup — never during the game loop.
 */
function initSprites() {
  for (const def of _byId.values()) {
    cacheSprite('block_' + def.id, BS, BS, (ctx, w, h) => {
      ctx.clearRect(0, 0, w, h);
      def.draw(ctx, w, h);
    });
    // Damaged tint overlay (50% red)
    cacheSprite('block_dmg_' + def.id, BS, BS, (ctx, w, h) => {
      ctx.clearRect(0, 0, w, h);
      def.draw(ctx, w, h);
      ctx.fillStyle = 'rgba(255,0,0,0.45)';
      ctx.fillRect(0, 0, w, h);
    });
  }
}

/** Return cached sprite canvas for a block id. */
function getBlockSprite(id) { return getSprite('block_' + id); }
function getBlockDmgSprite(id) { return getSprite('block_dmg_' + id); }

// ═══ src/ship/ShipStats.js ═══
// src/ship/ShipStats.js — compute ship stats from block composition

const _stats = {
  mass: 0,
  hp: 0,
  maxHp: 0,
  thrust: 0,
  powerGen: 0,
  powerDraw: 0,
  powerBalance: 0,
  shieldMax: 0,
  shieldRegen: 0,
  cargoCapacity: BASE_CARGO,
  radarRange: 600,
  weaponCount: 0,
  drillCount: 0,
  droneCount: 0,
  batteryCapacity: 0,
  engineCount: 0,
  blockCount: 0,
};

function calcStats(blocks) {
  _stats.mass            = 0;
  _stats.maxHp           = 0;
  _stats.thrust          = 0;
  _stats.powerGen        = 0;
  _stats.powerDraw       = 0;
  _stats.shieldMax       = 0;
  _stats.shieldRegen     = 0;
  _stats.cargoCapacity   = BASE_CARGO;
  _stats.radarRange      = 600;
  _stats.weaponCount     = 0;
  _stats.drillCount      = 0;
  _stats.droneCount      = 0;
  _stats.batteryCapacity = 0;
  _stats.engineCount     = 0;
  _stats.blockCount      = 0;

  for (const blk of blocks.values()) {
    const def = getDef(blk.typeId);
    _stats.mass      += def.mass;
    _stats.maxHp     += def.hp;
    _stats.powerGen  += def.powerGen;
    _stats.powerDraw += def.powerDraw;

    const eff = def.effect;
    if (eff.thrust)        { _stats.thrust        += eff.thrust;        _stats.engineCount++; }
    if (eff.shieldMax)       _stats.shieldMax      += eff.shieldMax;
    if (eff.shieldRegen)     _stats.shieldRegen    += eff.shieldRegen;
    if (eff.cargoBonus)      _stats.cargoCapacity  += eff.cargoBonus;
    if (eff.radarRange)      _stats.radarRange      = Math.max(_stats.radarRange, eff.radarRange);
    if (eff.weaponDmg)       _stats.weaponCount++;
    if (eff.drillDmg)        _stats.drillCount++;
    if (eff.drones)          _stats.droneCount     += eff.drones;
    if (eff.batteryCapacity) _stats.batteryCapacity += eff.batteryCapacity;
    _stats.blockCount++;
  }

  _stats.powerBalance = _stats.powerGen - _stats.powerDraw;
  if (_stats.powerBalance < 0 && _stats.powerGen > 0) {
    const ratio = _stats.powerGen / _stats.powerDraw;
    _stats.thrust *= ratio;
  }

  return _stats;
}

    this._blockStock = Object.create(null);
  }

  // ── Cargo (ship) ───────────────────────────────────────────────────────────

  setCapacity(cap) { this.cargoCapacity = Math.max(1, cap); }

  /** Add ore to ship cargo, respecting weight limit. Returns amount actually added. */
  addOre(oreId, amount) {
    const weight   = ORE_WEIGHT[oreId] ?? 1;
    const free     = this.cargoCapacity - this.cargoUsed;
    const canAdd   = Math.max(0, Math.floor(free / weight));
    const actual   = Math.min(amount, canAdd);
    if (actual <= 0) return 0;
    this._cargo[oreId]  = (this._cargo[oreId]  || 0) + actual;
    this.cargoUsed      += actual * weight;
    return actual;
  }

  getCargo(oreId)   { return this._cargo[oreId] ?? 0; }
  cargoFull()       { return this.cargoUsed >= this.cargoCapacity; }
  cargoEntries()    { return Object.entries(this._cargo); }

  // ── Station ore ────────────────────────────────────────────────────────────

  /** Move all ship cargo to station ore storage. */
  depositAllOre() {
    for (const id in this._cargo) {
      if (this._cargo[id] > 0) {
        this._stationOre[id] = (this._stationOre[id] || 0) + this._cargo[id];
      }
    }
    this._cargo    = Object.create(null);
    this.cargoUsed = 0;
  }

  getStationOre(oreId) { return this._stationOre[oreId] ?? 0; }
  stationOreEntries()  { return Object.entries(this._stationOre); }

  // ── Materials (refined at station) ─────────────────────────────────────────

  getMat(matId)    { return this._materials[matId] ?? 0; }
  matEntries()     { return Object.entries(this._materials); }

  addMat(matId, n) { this._materials[matId] = (this._materials[matId] || 0) + n; }

  canAffordMat(cost) {
    for (const id in cost) {
      if ((this._materials[id] || 0) < cost[id]) return false;
    }
    return true;
  }

  spendMat(cost) {
    if (!this.canAffordMat(cost)) return false;
    for (const id in cost) this._materials[id] -= cost[id];
    return true;
  }

  /** Refine station ore into material. Returns units produced (0 if insufficient). */
  refineOre(oreId, matId, orePerMat) {
    const have   = this._stationOre[oreId] ?? 0;
    const canMake = Math.floor(have / orePerMat);
    if (canMake <= 0) return 0;
    const useOre = canMake * orePerMat;
    this._stationOre[oreId] -= useOre;
    this._materials[matId]   = (this._materials[matId] || 0) + canMake;
    return canMake;
  }

  // ── Block stock (crafted at station) ───────────────────────────────────────

  getBlocks(typeId)  { return this._blockStock[typeId] ?? 0; }
  blockEntries()     { return Object.entries(this._blockStock); }
  addBlock(typeId, n = 1) { this._blockStock[typeId] = (this._blockStock[typeId] || 0) + n; }

  spendBlock(typeId, n = 1) {
    if ((this._blockStock[typeId] || 0) < n) return false;
    this._blockStock[typeId] -= n;
    return true;
  }

  // ── Serialisation ──────────────────────────────────────────────────────────

  toJSON() {
    return {
      cargo:      { ...this._cargo      },
      stationOre: { ...this._stationOre },
      materials:  { ...this._materials  },
      blockStock: { ...this._blockStock },
    };
  }

  fromJSON(data) {
    if (data.cargo)      { this._cargo      = Object.create(null); Object.assign(this._cargo,      data.cargo);      }
    if (data.stationOre) { this._stationOre = Object.create(null); Object.assign(this._stationOre, data.stationOre); }
    if (data.materials)  { this._materials  = Object.create(null); Object.assign(this._materials,  data.materials);  }
    if (data.blockStock) { this._blockStock = Object.create(null); Object.assign(this._blockStock, data.blockStock); }
    this._recalcCargoUsed();
  }

  _recalcCargoUsed() {
    let total = 0;
    for (const id in this._cargo) total += (this._cargo[id] || 0) * (ORE_WEIGHT[id] ?? 1);
    this.cargoUsed = total;
  }
}

// ═══ src/ship/Ship.js ═══
// src/ship/Ship.js — ship entity: physics, block grid, rendering, damage

let _nextBlockId = 1;

/** Create a fresh block instance (plain object — no class overhead). */
function makeBlock(typeId, gx, gy) {
  const def = getDef(typeId);
  return {
    id: _nextBlockId++,
    typeId,
    gx, gy,
    hp: def.hp,
    maxHp: def.hp,
    _pooled: false,
    // weapon cooldown state
    _wCooldown: 0,
    // drill state
    _dActive: false,
  };
}

class Ship {
  /**
   * @param {number} wx  World x
   * @param {number} wy  World y
   * @param {boolean} isPlayer
   */
  constructor(wx, wy, isPlayer = false) {
    // Physics
    this.x  = wx; this.y  = wy;
    this.vx = 0;  this.vy = 0;
    this.angle = 0;  // radians, 0 = pointing right (+x)
    this.av = 0;     // angular velocity

    this.isPlayer  = isPlayer;
    this.alive     = true;
    this._pooled   = false;

    // Block grid: key = `${gx},${gy}`, value = block object
    this.blocks = new Map();

    // Cached stats (recalculated when block set changes)
    this.stats = null;
    this._statsDirty = true;

    // Combat state
    this.hp        = 0;
    this.shieldHp  = 0;
    this.shieldMax = 0;
    this._power    = 0;    // current power (may be limited)

    // Pre-rendered ship canvas (invalidated on structure change)
    this._sprite       = null;
    this._spriteOffX   = 0;  // offset to centre the sprite
    this._spriteOffY   = 0;
    this._spriteDirty  = true;
  }

  // ── Block management ─────────────────────────────────────────────────────

  addBlock(typeId, gx, gy) {
    const key = `${gx},${gy}`;
    if (this.blocks.has(key)) return false;
    this.blocks.set(key, makeBlock(typeId, gx, gy));
    this._statsDirty  = true;
    this._spriteDirty = true;
    return true;
  }

  removeBlock(gx, gy) {
    const key = `${gx},${gy}`;
    if (!this.blocks.has(key)) return false;
    const blk = this.blocks.get(key);
    if (!getDef(blk.typeId).canDelete) return false;
    this.blocks.delete(key);
    this._statsDirty  = true;
    this._spriteDirty = true;
    return true;
  }

  getBlock(gx, gy) { return this.blocks.get(`${gx},${gy}`) ?? null; }
  hasBlock(gx, gy) { return this.blocks.has(`${gx},${gy}`); }

  /** Damage block at world position (bx, by). Returns excess damage (0 if absorbed). */
  damageAt(bx, by, amount) {
    // Transform world point into ship local space
    const dx = bx - this.x;
    const dy = by - this.y;
    const cos = Math.cos(-this.angle);
    const sin = Math.sin(-this.angle);
    const lx = rotX(dx, dy, cos, sin);
    const ly = rotY(dx, dy, cos, sin);
    const gx = Math.round(lx / BS);
    const gy = Math.round(ly / BS);

    return this.damageBlock(gx, gy, amount);
  }

  damageBlock(gx, gy, amount) {
    const blk = this.getBlock(gx, gy);
    if (!blk) return amount;

    // Shield absorbs first
    let dmg = amount;
    if (this.shieldHp > 0) {
      const absorbed = Math.min(this.shieldHp, dmg);
      this.shieldHp -= absorbed;
      dmg -= absorbed;
      if (dmg <= 0) return 0;
    }

    const actualDmg = Math.min(dmg, blk.hp);
    blk.hp -= actualDmg;
    this.hp  = Math.max(0, this.hp - actualDmg); // fast-track update

    if (blk.hp <= 0) {
      const overflow = -blk.hp;
      this.blocks.delete(`${gx},${gy}`);
      this._statsDirty  = true;
      this._spriteDirty = true;
      if (gx === 0 && gy === 0) this.alive = false;
      return overflow > 0 ? overflow : 0;
    }
    this._spriteDirty = true;
    return 0;
  }

  // ── Stats ─────────────────────────────────────────────────────────────────

  recalcStats() {
    if (!this._statsDirty) return;
    const s = calcStats(this.blocks);
    if (!this.stats) this.stats = {};
    Object.assign(this.stats, s);

    // Recompute current HP accurately from block HPs
    let currentHp = 0;
    for (const blk of this.blocks.values()) currentHp += blk.hp;
    this.hp = currentHp || s.maxHp; // use maxHp if blocks just created

    this.shieldMax = s.shieldMax;
    if (this.shieldHp > this.shieldMax) this.shieldHp = this.shieldMax;
    this._statsDirty = false;
  }

  // ── Physics ───────────────────────────────────────────────────────────────

  /**
   * Apply thrust in the ship's forward direction.
   * @param {number} throttle  0..1
   * @param {number} torque    -1..1 (negative = turn left / counter-clockwise)
   * @param {number} dt
   */
  applyThrust(throttle, torque, dt) {
    if (!this.stats) return;
    const mass   = Math.max(this.stats.mass, 1);
    const thrust = this.stats.thrust;
    const accel  = (thrust / mass) * throttle;

    const cos = Math.cos(this.angle);
    const sin = Math.sin(this.angle);
    this.vx += cos * accel * dt;
    this.vy += sin * accel * dt;

    const turnRate = 2.2 / Math.max(mass * 0.15, 1);
    this.av += torque * turnRate * dt;
  }

  update(dt) {
    this.recalcStats();

    // Integrate position
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.angle += this.av * dt;

    // Damping
    this.vx *= DRAG;
    this.vy *= DRAG;
    this.av *= ANG_DRAG;

    // Shield regen
    if (this.shieldHp < this.shieldMax) {
      this.shieldHp = Math.min(this.shieldMax, this.shieldHp + this.stats.shieldRegen * dt);
    }

    // Block cooldowns
    for (const blk of this.blocks.values()) {
      if (blk._wCooldown > 0) blk._wCooldown -= dt;
    }
  }

  // ── Sprite cache ──────────────────────────────────────────────────────────

  _rebuildSprite() {
    // Compute bounding box in local block space
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const blk of this.blocks.values()) {
      const lx = blk.gx * BS;
      const ly = blk.gy * BS;
      if (lx < minX) minX = lx; if (lx > maxX) maxX = lx;
      if (ly < minY) minY = ly; if (ly > maxY) maxY = ly;
    }
    if (this.blocks.size === 0) { this._sprite = null; return; }

    const pad  = BS / 2;
    const w    = (maxX - minX + BS) + pad * 2;
    const h    = (maxY - minY + BS) + pad * 2;
    const offX = minX - pad;  // world local offset to sprite top-left
    const offY = minY - pad;

    // Reuse or create canvas
    if (!this._sprite || this._sprite.width !== (w | 0) || this._sprite.height !== (h | 0)) {
      if (typeof OffscreenCanvas !== 'undefined') {
        this._sprite = new OffscreenCanvas(w | 0, h | 0);
      } else {
        this._sprite = document.createElement('canvas');
        this._sprite.width  = w | 0;
        this._sprite.height = h | 0;
      }
    }

    const ctx = this._sprite.getContext('2d');
    ctx.clearRect(0, 0, w, h);

    for (const blk of this.blocks.values()) {
      const sprite = getBlockSprite(blk.typeId);
      if (!sprite) continue;
      const px = blk.gx * BS - offX - BS / 2;
      const py = blk.gy * BS - offY - BS / 2;
      ctx.drawImage(sprite, px, py, BS, BS);

      // Draw damage tint
      if (blk.hp < blk.maxHp) {
        const t = 1 - blk.hp / blk.maxHp;
        ctx.fillStyle = `rgba(255,30,0,${(t * 0.55).toFixed(2)})`;
        ctx.fillRect(px, py, BS, BS);
      }
    }

    this._spriteOffX   = offX;
    this._spriteOffY   = offY;
    this._spriteDirty  = false;
  }

  // ── Rendering ─────────────────────────────────────────────────────────────

  draw(ctx) {
    if (!this.alive || this.blocks.size === 0) return;
    if (this._spriteDirty) this._rebuildSprite();
    if (!this._sprite) return;

    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    ctx.drawImage(this._sprite, this._spriteOffX, this._spriteOffY);
    ctx.restore();
  }

  /** Draw shield bubble (separate pass for transparency). */
  drawShield(ctx) {
    if (this.shieldHp <= 0 || this.shieldMax <= 0) return;
    const r = (Math.sqrt(this.blocks.size) * BS * 0.75) + 8;
    const alpha = (this.shieldHp / this.shieldMax) * 0.35 + 0.05;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fillStyle   = `rgba(80,100,255,${alpha.toFixed(2)})`;
    ctx.strokeStyle = `rgba(120,160,255,${(alpha * 2).toFixed(2)})`;
    ctx.lineWidth   = 1.5;
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  /** Approximate bounding radius for culling / collision. */
  get radius() {
    return Math.sqrt(this.blocks.size) * BS * 0.65 + BS;
  }

  // ── Serialisation ─────────────────────────────────────────────────────────

  toJSON() {
    const blks = [];
    for (const blk of this.blocks.values()) {
      blks.push({ typeId: blk.typeId, gx: blk.gx, gy: blk.gy, hp: blk.hp });
    }
    return { x: this.x, y: this.y, angle: this.angle, vx: this.vx, vy: this.vy, blocks: blks };
  }

  static fromJSON(data, isPlayer = false) {
    const ship = new Ship(data.x, data.y, isPlayer);
    ship.angle = data.angle || 0;
    ship.vx    = data.vx   || 0;
    ship.vy    = data.vy   || 0;
    for (const b of data.blocks) {
      ship.addBlock(b.typeId, b.gx, b.gy);
      const blk = ship.getBlock(b.gx, b.gy);
      if (blk && b.hp !== undefined) blk.hp = b.hp;
    }
    ship.recalcStats();
    ship.shieldHp = ship.shieldMax;
    return ship;
  }
}

// src/world/Asteroid.js — asteroid entity with HP and resource drops

const VARIANTS = 5;
const MIN_R    = 20;
const MAX_R    = 60;

function initAsteroidSprites() {
  for (let v = 0; v < VARIANTS; v++) {
    const r   = MIN_R + (v / (VARIANTS - 1)) * (MAX_R - MIN_R);
    const key = `ast_${v}`;
    const sz  = (r * 2 + 4) | 0;
    cacheSprite(key, sz, sz, (ctx, w, h) => {
      const cx = w / 2, cy = h / 2;
      const pts = 9 + (v % 3);
      ctx.beginPath();
      for (let i = 0; i < pts; i++) {
        const a      = (i / pts) * Math.PI * 2;
        const jitter = 0.65 + 0.35 * Math.abs(Math.sin(v * 7.3 + i * 2.1));
        const pr     = r * jitter;
        const px     = cx + Math.cos(a) * pr;
        const py     = cy + Math.sin(a) * pr;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      const g = ctx.createRadialGradient(cx - r*0.2, cy - r*0.2, r*0.1, cx, cy, r);
      g.addColorStop(0, '#a09080');
      g.addColorStop(1, '#504038');
      ctx.fillStyle = g;
      ctx.fill();
      ctx.strokeStyle = '#302820'; ctx.lineWidth = 1;
      ctx.stroke();
      ctx.strokeStyle = '#605040'; ctx.lineWidth = 0.8;
      for (let i = 0; i < 3; i++) {
        const ax = cx + (Math.sin(v * 3.1 + i) * r * 0.4);
        const ay = cy + (Math.cos(v * 2.7 + i) * r * 0.4);
        ctx.beginPath();
        ctx.arc(ax, ay, r * 0.12, 0, Math.PI * 2);
        ctx.stroke();
      }
    });
  }
}

const DROP_TABLE = [
  { id: ORE.IRON,        weight: 50, min: 3, max: 8 },
  { id: ORE.COPPER,      weight: 25, min: 2, max: 5 },
  { id: ORE.CRYSTAL,     weight: 15, min: 1, max: 3 },
  { id: ORE.TITANIUM,    weight: 8,  min: 1, max: 2 },
  { id: ORE.DARK_MATTER, weight: 2,  min: 1, max: 1 },
];
const _totalWeight = DROP_TABLE.reduce((s, e) => s + e.weight, 0);

function rollDrop(rng) {
  let roll = rng() * _totalWeight;
  for (const entry of DROP_TABLE) {
    roll -= entry.weight;
    if (roll <= 0) {
      const count = entry.min + Math.floor(rng() * (entry.max - entry.min + 1));
      return { id: entry.id, count };
    }
  }
  return { id: ORE.IRON, count: 1 };
}

class Asteroid {
  constructor() {
    this.x  = 0; this.y  = 0;
    this.vx = 0; this.vy = 0;
    this.variant = 0;
    this.radius  = MIN_R;
    this.maxHp   = 100;
    this.hp      = 100;
    this.angle   = 0;
    this.av      = 0;
    this.alive   = false;
    this._pooled = false;
    this._drops  = [];
  }

  init(x, y, variant, rng) {
    this.x   = x; this.y = y;
    this.vx  = (rng() - 0.5) * 10;
    this.vy  = (rng() - 0.5) * 10;
    this.angle = rng() * Math.PI * 2;
    this.av    = (rng() - 0.5) * 0.2;
    this.variant = variant % VARIANTS;
    const t  = this.variant / (VARIANTS - 1);
    this.radius = MIN_R + t * (MAX_R - MIN_R);
    this.maxHp  = 50 + this.radius * 4 | 0;
    this.hp     = this.maxHp;
    this.alive  = true;

    this._drops.length = 0;
    const numDrops = 1 + (this.variant >> 1);
    for (let i = 0; i < numDrops; i++) {
      this._drops.push(rollDrop(rng));
    }
  }

  update(dt) {
    this.x     += this.vx * dt;
    this.y     += this.vy * dt;
    this.angle += this.av * dt;
    this.vx    *= 0.999;
    this.vy    *= 0.999;
  }

  getDrops() { return this._drops; }

  draw(ctx) {
    if (!this.alive) return;
    const sprite = getSprite(`ast_${this.variant}`);
    if (!sprite) return;
    const sw = sprite.width, sh = sprite.height;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    ctx.drawImage(sprite, -sw / 2, -sh / 2, sw, sh);
    if (this.hp < this.maxHp) {
      const t = 1 - this.hp / this.maxHp;
      ctx.fillStyle = `rgba(255,60,0,${(t * 0.4).toFixed(2)})`;
      ctx.beginPath();
      ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
}

// src/world/DropItem.js — floating ore drop entity

class DropItem {
  constructor() {
    this.x  = 0; this.y  = 0;
    this.vx = 0; this.vy = 0;
    this.resId  = '';
    this.count  = 0;
    this.alive  = false;
    this._pooled= false;
    this._life  = 30;
    this._t     = 0;
  }

  init(x, y, resId, count) {
    this.x    = x; this.y = y;
    this.vx   = (Math.random() - 0.5) * 40;
    this.vy   = (Math.random() - 0.5) * 40;
    this.resId = resId;
    this.count = count;
    this.alive = true;
    this._life = 30;
    this._t    = 0;
  }

  update(dt) {
    this.x  += this.vx * dt;
    this.y  += this.vy * dt;
    this.vx *= 0.97;
    this.vy *= 0.97;
    this._t += dt;
    this._life -= dt;
    if (this._life <= 0) this.alive = false;
  }

  draw(ctx) {
    if (!this.alive) return;
    const bob  = Math.sin(this._t * 3) * 2;
    const size = 8;
    const col  = ORE_COLORS[this.resId] ?? '#ffffff';
    ctx.save();
    ctx.translate(this.x, this.y + bob);
    ctx.fillStyle   = col;
    ctx.strokeStyle = '#000000';
    ctx.lineWidth   = 1;
    ctx.fillRect(-size * 0.5, -size * 0.5, size, size);
    ctx.strokeRect(-size * 0.5, -size * 0.5, size, size);
    ctx.restore();
  }
}

// src/world/Station.js — animated home base station at world origin

class Station {
  constructor() {
    this.x = STATION_X;
    this.y = STATION_Y;
    this._t = 0;

    // Pre-render glow sprite once to avoid per-frame gradient creation
    const sz = 50;
    const gc = (typeof OffscreenCanvas !== 'undefined')
      ? new OffscreenCanvas(sz, sz)
      : (() => { const c = document.createElement('canvas'); c.width = sz; c.height = sz; return c; })();
    const gctx = gc.getContext('2d');
    const g = gctx.createRadialGradient(sz/2, sz/2, 2, sz/2, sz/2, sz/2 - 3);
    g.addColorStop(0, 'rgba(60,180,255,1)');
    g.addColorStop(1, 'rgba(20,80,180,0)');
    gctx.fillStyle = g;
    gctx.beginPath();
    gctx.arc(sz/2, sz/2, sz/2 - 3, 0, Math.PI * 2);
    gctx.fill();
    this._glowSprite = gc;
    this._glowHalf   = sz / 2;
  }

  update(dt) { this._t += dt; }

  draw(ctx) {
    const t = this._t;
    ctx.save();
    ctx.translate(this.x, this.y);

    // Dock range faint ring
    ctx.strokeStyle = 'rgba(60,200,100,0.08)';
    ctx.fillStyle   = 'rgba(60,200,100,0.03)';
    ctx.lineWidth   = 1;
    ctx.beginPath();
    ctx.arc(0, 0, STATION_DOCK_RANGE, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Outer rotating ring
    ctx.save();
    ctx.rotate(t * 0.12);
    ctx.strokeStyle = '#1a3858';
    ctx.lineWidth   = 4;
    ctx.beginPath();
    ctx.arc(0, 0, 82, 0, Math.PI * 2);
    ctx.stroke();
    for (let i = 0; i < 6; i++) {
      const a  = (i / 6) * Math.PI * 2;
      const cx = Math.cos(a), cy = Math.sin(a);
      ctx.strokeStyle = '#1a3050';
      ctx.lineWidth   = 2;
      ctx.beginPath();
      ctx.moveTo(cx * 30, cy * 30);
      ctx.lineTo(cx * 82, cy * 82);
      ctx.stroke();
      ctx.fillStyle = '#2a5878';
      ctx.beginPath();
      ctx.arc(cx * 82, cy * 82, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#3a80b0';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    ctx.restore();

    // Inner counter-rotating ring
    ctx.save();
    ctx.rotate(-t * 0.28);
    ctx.strokeStyle = '#204870';
    ctx.lineWidth   = 2.5;
    ctx.beginPath();
    ctx.arc(0, 0, 46, 0, Math.PI * 2);
    ctx.stroke();
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2;
      ctx.fillStyle   = '#305878';
      ctx.strokeStyle = '#50a0d0';
      ctx.lineWidth   = 1;
      ctx.beginPath();
      ctx.arc(Math.cos(a) * 46, Math.sin(a) * 46, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }
    ctx.restore();

    // Static docking arms
    for (let i = 0; i < 3; i++) {
      const a  = (i / 3) * Math.PI * 2;
      const cx = Math.cos(a), cy = Math.sin(a);
      ctx.strokeStyle = '#285888';
      ctx.lineWidth   = 5;
      ctx.beginPath();
      ctx.moveTo(cx * 26, cy * 26);
      ctx.lineTo(cx * 56, cy * 56);
      ctx.stroke();
      ctx.fillStyle   = '#3a80c0';
      ctx.strokeStyle = '#60c0ff';
      ctx.lineWidth   = 1;
      ctx.beginPath();
      ctx.arc(cx * 56, cy * 56, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }

    // Central hub
    ctx.fillStyle   = '#0c1e30';
    ctx.strokeStyle = '#3070b8';
    ctx.lineWidth   = 2.5;
    ctx.beginPath();
    ctx.arc(0, 0, 26, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Core glow (pulsing) — pre-rendered sprite, only globalAlpha changes
    const pulse = 0.7 + 0.3 * Math.sin(t * 2.4);
    ctx.globalAlpha = pulse;
    ctx.drawImage(this._glowSprite, -this._glowHalf, -this._glowHalf);
    ctx.globalAlpha = 1;

    ctx.restore();
  }
}

// ═══ src/world/World.js ═══
// src/world/World.js — chunk-based infinite world with asteroid/enemy spawning

const asteroidPool = new Pool(
  () => new Asteroid(),
  (a) => { a.alive = false; }
);

const dropPool = new Pool(
  () => new DropItem(),
  (d) => { d.alive = false; d.count = 0; }
);

asteroidPool.prewarm(40);
dropPool.prewarm(60);

class World {
  constructor(seed = 42) {
    this._seed            = seed;
    this._activeChunks    = new Set();
    this._asteroids       = [];
    this._drops           = [];
    this._enemySpawnQueue = [];
    this._pruneTimer      = 0;
    this._lastPcx         = null;
    this._lastPcy         = null;
  }

  init() { initAsteroidSprites(); }

  _chunkKey(cx, cy) { return `${cx},${cy}`; }

  _activateChunk(cx, cy) {
    const key = this._chunkKey(cx, cy);
    if (this._activeChunks.has(key)) return;
    this._activeChunks.add(key);
    this._spawnChunkContent(cx, cy);
  }

  _deactivateChunk(cx, cy) { this._activeChunks.delete(this._chunkKey(cx, cy)); }

  _spawnChunkContent(cx, cy) {
    const seed = hashInt2(cx, cy) ^ this._seed;
    const rng  = makePRNG(seed);

    if (rng() < ASTEROID_DENSITY) {
      const count = 1 + Math.floor(rng() * ASTEROIDS_PER_CHUNK);
      for (let i = 0; i < count; i++) {
        const ax = cx * CHUNK_PX + rng() * CHUNK_PX;
        const ay = cy * CHUNK_PX + rng() * CHUNK_PX;
        const variant = rng() * 10 | 0;
        const a = asteroidPool.get();
        a.init(ax, ay, variant, rng);
        this._asteroids.push(a);
      }
    }

    if (rng() < ENEMY_DENSITY) {
      const count = Math.floor(rng() * ENEMIES_PER_CHUNK) + 1;
      for (let i = 0; i < count; i++) {
        const ex = cx * CHUNK_PX + rng() * CHUNK_PX;
        const ey = cy * CHUNK_PX + rng() * CHUNK_PX;
        this._enemySpawnQueue.push({ x: ex, y: ey });
      }
    }
  }

  _pruneChunks(pcx, pcy, R) {
    const toDelete = [];
    for (const key of this._activeChunks) {
      const ci = key.indexOf(',');
      const cx = parseInt(key, 10);
      const cy = parseInt(key.slice(ci + 1), 10);
      if (Math.abs(cx - pcx) > R + 2 || Math.abs(cy - pcy) > R + 2) {
        toDelete.push(key);
      }
    }
    for (const key of toDelete) this._activeChunks.delete(key);
  }

  /** Update world each frame. inventory.addOre() is cargo-capacity-aware. */
  update(playerX, playerY, dt, inventory) {
    const pcx = Math.floor(playerX / CHUNK_PX);
    const pcy = Math.floor(playerY / CHUNK_PX);
    const R   = ACTIVE_RADIUS_CHUNKS;

    for (let dx = -R; dx <= R; dx++) {
      for (let dy = -R; dy <= R; dy++) {
        this._activateChunk(pcx + dx, pcy + dy);
      }
    }

    // Prune stale chunk records every 5 seconds to prevent unbounded growth
    this._pruneTimer += dt;
    if (this._pruneTimer > 5) {
      this._pruneTimer = 0;
      this._pruneChunks(pcx, pcy, R);
    }

    const astDespSq = ASTEROID_DESPAWN_DIST * ASTEROID_DESPAWN_DIST;
    for (let i = this._asteroids.length - 1; i >= 0; i--) {
      const a = this._asteroids[i];
      if (!a.alive || dist2(a.x, a.y, playerX, playerY) > astDespSq) {
        asteroidPool.release(a);
        this._asteroids.splice(i, 1);
        continue;
      }
      a.update(dt);
    }

    const pickSq = PICKUP_RANGE * PICKUP_RANGE;
    for (let i = this._drops.length - 1; i >= 0; i--) {
      const d = this._drops[i];
      if (!d.alive) { dropPool.release(d); this._drops.splice(i, 1); continue; }
      d.update(dt);
      if (dist2(d.x, d.y, playerX, playerY) < pickSq) {
        const added = inventory.addOre(d.resId, d.count);
        if (added > 0 || d._life < 1) {
          // Only remove if at least partially picked up, or about to expire
          if (added >= d.count) {
            d.alive = false;
            dropPool.release(d);
            this._drops.splice(i, 1);
          } else {
            // Partial pickup — reduce count
            d.count -= added;
          }
        }
      }
    }
  }

  damageAsteroid(asteroid, amount) {
    asteroid.hp -= amount;
    if (asteroid.hp <= 0) {
      for (const drop of asteroid.getDrops()) {
        const d = dropPool.get();
        d.init(asteroid.x, asteroid.y, drop.id, drop.count);
        this._drops.push(d);
      }
      asteroid.alive = false;
      return true;
    }
    return false;
  }

  drainEnemySpawns() {
    const q = this._enemySpawnQueue.slice();
    this._enemySpawnQueue.length = 0;
    return q;
  }

  get asteroids() { return this._asteroids; }
  get drops()     { return this._drops; }

  drawDrops(ctx)     { for (const d of this._drops)     d.draw(ctx); }
  drawAsteroids(ctx) { for (const a of this._asteroids) a.draw(ctx); }
}

// ═══ src/combat/Bullet.js ═══
// src/combat/Bullet.js — poolable projectile entity

class Bullet {
  constructor() {
    this.x  = 0; this.y  = 0;
    this.vx = 0; this.vy = 0;
    this.damage    = 20;
    this.isPlayer  = true;
    this.life      = 0;
    this.alive     = false;
    this._pooled   = false;
  }

  init(x, y, angle, damage, isPlayer, speedMult = 1) {
    this.x        = x; this.y = y;
    const s       = BULLET_SPEED * speedMult;
    this.vx       = Math.cos(angle) * s;
    this.vy       = Math.sin(angle) * s;
    this.damage   = damage;
    this.isPlayer = isPlayer;
    this.life     = BULLET_LIFE;
    this.alive    = true;
  }

  update(dt) {
    this.x    += this.vx * dt;
    this.y    += this.vy * dt;
    this.life -= dt;
    if (this.life <= 0) this.alive = false;
  }

  draw(ctx, isPlayer) {
    if (!this.alive) return;
    ctx.fillStyle = isPlayer ? '#ffe080' : '#ff5030';
    // Bullet is a small rotated rectangle
    const cos = this.vx / BULLET_SPEED;
    const sin = this.vy / BULLET_SPEED;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(Math.atan2(this.vy, this.vx));
    ctx.fillRect(-5, -1.5, 10, 3);
    ctx.restore();
  }
}

// ═══ src/combat/WeaponSystem.js ═══
// src/combat/WeaponSystem.js — weapon firing + bullet pooling

// Shared bullet pool for player and enemy bullets
const bulletPool = new Pool(
  () => new Bullet(),
  (b) => { b.alive = false; }
);
bulletPool.prewarm(80);

// All live bullets (single array, checked by Game each frame)
const bullets = [];

/**
 * Try to fire weapon blocks on `ship` toward `targetX, targetY`.
 * `isPlayer` flag determines bullet faction.
 */
function fireWeapons(ship, targetX, targetY, isPlayer) {
  const cos = Math.cos(-ship.angle);
  const sin = Math.sin(-ship.angle);
  const fired = [];

  for (const blk of ship.blocks.values()) {
    const def = getDef(blk.typeId);
    if (blk.typeId !== BID.WEAPON) continue;
    if (blk._wCooldown > 0) continue;

    const eff  = def.effect;
    // Muzzle position in world space
    const lx   = blk.gx * 32 + 16; // +16 = block half-width (barrel tip)
    const ly   = blk.gy * 32;
    const wCos = Math.cos(ship.angle);
    const wSin = Math.sin(ship.angle);
    const mx   = ship.x + rotX(lx, ly, wCos, wSin);
    const my   = ship.y + rotY(lx, ly, wCos, wSin);

    // Auto-aim: check if target is within arc
    const aimAngle = angleTo(mx, my, targetX, targetY);
    const maxArc   = Math.PI * 0.5; // 90° each side

    // Weapon points right (+x) in ship local space
    const weaponWorldAngle = ship.angle;
    const diff = angleDiff(weaponWorldAngle, aimAngle);

    if (Math.abs(diff) > maxArc) continue;

    // Fire
    const b = bulletPool.get();
    b.init(mx, my, aimAngle, eff.weaponDmg ?? 20, isPlayer);
    bullets.push(b);
    blk._wCooldown = eff.weaponCooldown ?? 0.5;
    fired.push(b);
  }
  return fired;
}

/** Update all bullets and remove dead ones. Returns array of live bullets. */
function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.update(dt);
    if (!b.alive) {
      bulletPool.release(b);
      bullets.splice(i, 1);
    }
  }
}

/** Draw all live bullets. */
function drawBullets(ctx) {
  ctx.save();
  for (const b of bullets) {
    if (!b.alive) continue;
    const angle = Math.atan2(b.vy, b.vx);
    const cos   = Math.cos(angle);
    const sin   = Math.sin(angle);
    ctx.fillStyle = b.isPlayer ? '#ffe080' : '#ff5030';
    ctx.setTransform(cos, sin, -sin, cos, b.x, b.y);
    ctx.fillRect(-5, -1.5, 10, 3);
  }
  ctx.restore();
}

/** Check if a bullet hits any ship in `ships` array. Returns { bullet, ship } or null. */
function checkBulletShipCollision(bullet, ships) {
  for (const ship of ships) {
    if (!ship.alive) continue;
    const r = ship.radius + 8;
    if (dist2(bullet.x, bullet.y, ship.x, ship.y) < r * r) {
      return ship;
    }
  }
  return null;
}

// ═══ src/enemy/EnemyAI.js ═══
// src/enemy/EnemyAI.js — finite state machine AI for enemy ships

// Tuning
const PATROL_SPEED       = 0.25;
const SEEK_DIST_SQ       = 1200 * 1200;  // enter seek state
const CHASE_DIST_SQ      = 900  * 900;   // enter chase
const ATTACK_DIST_SQ     = 450  * 450;   // enter attack mode
const FLEE_HP_RATIO      = 0.2;          // flee below 20% HP
const FLEE_DIST_SQ       = 1600 * 1600;  // stop fleeing

class EnemyAI {
  constructor(ship) {
    this.ship    = ship;
    this.state   = AI.PATROL;
    this._timer  = 0;
    this._patrolAngle = Math.random() * Math.PI * 2;
    this._originX     = ship.x;
    this._originY     = ship.y;
  }

  update(dt, playerX, playerY, fireCallback) {
    const ship = this.ship;
    if (!ship.alive) return;

    const pDist2 = dist2(ship.x, ship.y, playerX, playerY);
    const stats  = ship.stats;
    const hpRatio = stats ? ship.hp / stats.maxHp : 1;

    this._timer += dt;

    // ── State transitions ──────────────────────────────────────────────
    switch (this.state) {
      case AI.PATROL:
        if (hpRatio < FLEE_HP_RATIO)      this._setState(AI.FLEE);
        else if (pDist2 < CHASE_DIST_SQ)  this._setState(AI.CHASE);
        else if (pDist2 < SEEK_DIST_SQ)   this._setState(AI.SEEK);
        break;

      case AI.SEEK:
        if (hpRatio < FLEE_HP_RATIO)      this._setState(AI.FLEE);
        else if (pDist2 < ATTACK_DIST_SQ) this._setState(AI.ATTACK);
        else if (pDist2 > SEEK_DIST_SQ)   this._setState(AI.PATROL);
        break;

      case AI.CHASE:
        if (hpRatio < FLEE_HP_RATIO)      this._setState(AI.FLEE);
        else if (pDist2 < ATTACK_DIST_SQ) this._setState(AI.ATTACK);
        else if (pDist2 > SEEK_DIST_SQ)   this._setState(AI.SEEK);
        break;

      case AI.ATTACK:
        if (hpRatio < FLEE_HP_RATIO)      this._setState(AI.FLEE);
        else if (pDist2 > ATTACK_DIST_SQ * 1.4) this._setState(AI.CHASE);
        break;

      case AI.FLEE:
        if (pDist2 > FLEE_DIST_SQ)        this._setState(AI.PATROL);
        break;
    }

    // ── State behaviours ──────────────────────────────────────────────
    switch (this.state) {
      case AI.PATROL:
        this._patrol(dt);
        break;

      case AI.SEEK:
        this._faceTarget(dt, playerX, playerY, 0.6);
        ship.applyThrust(PATROL_SPEED * 1.5, this._steerToward(playerX, playerY), dt);
        break;

      case AI.CHASE:
        this._faceTarget(dt, playerX, playerY, 0.9);
        ship.applyThrust(0.9, this._steerToward(playerX, playerY), dt);
        break;

      case AI.ATTACK:
        // Orbit player at moderate distance
        this._orbit(dt, playerX, playerY, 350);
        // Fire every frame (weapon has its own cooldown)
        fireCallback(ship, playerX, playerY, false);
        break;

      case AI.FLEE: {
        const awayAngle = angleTo(playerX, playerY, ship.x, ship.y);
        this._faceTarget(dt, ship.x + Math.cos(awayAngle) * 1000, ship.y + Math.sin(awayAngle) * 1000, 1);
        ship.applyThrust(1.0, this._steerToAngle(awayAngle), dt);
        break;
      }
    }
  }

  _setState(s) {
    this.state  = s;
    this._timer = 0;
  }

  _patrol(dt) {
    const ship = this.ship;
    // Wander in a circle around origin
    if (this._timer > 3 + Math.random() * 2) {
      this._patrolAngle += (Math.random() - 0.5) * Math.PI * 0.8;
      this._timer = 0;
    }
    const tx = this._originX + Math.cos(this._patrolAngle) * 200;
    const ty = this._originY + Math.sin(this._patrolAngle) * 200;
    ship.applyThrust(PATROL_SPEED, this._steerToward(tx, ty), dt);
  }

  _orbit(dt, cx, cy, radius) {
    const ship  = this.ship;
    const angle = angleTo(cx, cy, ship.x, ship.y);
    const perpAngle = angle + Math.PI * 0.5;
    const tx = cx + Math.cos(angle) * radius + Math.cos(perpAngle) * 80;
    const ty = cy + Math.sin(angle) * radius + Math.sin(perpAngle) * 80;
    ship.applyThrust(0.6, this._steerToward(tx, ty), dt);
  }

  _steerToward(tx, ty) {
    return this._steerToAngle(angleTo(this.ship.x, this.ship.y, tx, ty));
  }

  _steerToAngle(targetAngle) {
    const diff = angleDiff(this.ship.angle, targetAngle);
    return Math.sign(diff) * Math.min(Math.abs(diff) * 2, 1);
  }

  _faceTarget(dt, tx, ty, lerp) {
    // Snap angle toward target
    const desired = angleTo(this.ship.x, this.ship.y, tx, ty);
    const diff    = angleDiff(this.ship.angle, desired);
    this.ship.angle += diff * lerp * dt * 5;
  }
}

// ═══ src/enemy/EnemyShip.js ═══
// src/enemy/EnemyShip.js — enemy ship factory + management

// Difficulty tiers: each is an array of { typeId, gx, gy }
const LAYOUTS = [
  // Tier 0 — Scout (3 blocks)
  [
    { typeId: BID.CORE,   gx: 0,  gy: 0  },
    { typeId: BID.ARMOR,  gx: -1, gy: 0  },
    { typeId: BID.WEAPON, gx: 1,  gy: 0  },
    { typeId: BID.ENGINE, gx: -2, gy: 0  },
    { typeId: BID.GENERATOR, gx: 0, gy: 1 },
  ],
  // Tier 1 — Fighter
  [
    { typeId: BID.CORE,      gx: 0,  gy: 0  },
    { typeId: BID.ARMOR,     gx: -1, gy: 0  },
    { typeId: BID.ARMOR,     gx: 1,  gy: 0  },
    { typeId: BID.ARMOR,     gx: 0,  gy: -1 },
    { typeId: BID.WEAPON,    gx: 1,  gy: -1 },
    { typeId: BID.WEAPON,    gx: 1,  gy:  1 },
    { typeId: BID.ENGINE,    gx: -2, gy: 0  },
    { typeId: BID.ENGINE,    gx: -2, gy: -1 },
    { typeId: BID.GENERATOR, gx: -1, gy: 1  },
    { typeId: BID.SHIELD,    gx:  0, gy: 1  },
  ],
  // Tier 2 — Heavy
  [
    { typeId: BID.CORE,      gx: 0,  gy:  0 },
    { typeId: BID.ARMOR,     gx: -1, gy:  0 },
    { typeId: BID.ARMOR,     gx:  1, gy:  0 },
    { typeId: BID.ARMOR,     gx:  0, gy: -1 },
    { typeId: BID.ARMOR,     gx:  0, gy:  1 },
    { typeId: BID.WEAPON,    gx:  2, gy: -1 },
    { typeId: BID.WEAPON,    gx:  2, gy:  0 },
    { typeId: BID.WEAPON,    gx:  2, gy:  1 },
    { typeId: BID.ENGINE,    gx: -2, gy: -1 },
    { typeId: BID.ENGINE,    gx: -2, gy:  1 },
    { typeId: BID.GENERATOR, gx: -1, gy: -1 },
    { typeId: BID.GENERATOR, gx: -1, gy:  1 },
    { typeId: BID.SHIELD,    gx:  1, gy: -1 },
    { typeId: BID.SHIELD,    gx:  1, gy:  1 },
  ],
];

// Reuse enemy ships to avoid GC spikes (ship objects are large)
// We use a simple free-list rather than Pool since Ship is stateful
const _freeShips = [];
function acquireEnemy(x, y, tier) {
  const ship = _freeShips.length > 0 ? _freeShips.pop() : new Ship(0, 0, false);
  ship.x = x; ship.y = y;
  ship.vx = 0; ship.vy = 0;
  ship.angle = Math.random() * Math.PI * 2;
  ship.av = 0;
  ship.alive = true;
  ship._pooled = false;
  ship.blocks.clear();
  ship._statsDirty  = true;
  ship._spriteDirty = true;
  ship._sprite      = null;

  const layout = LAYOUTS[Math.min(tier, LAYOUTS.length - 1)];
  for (const b of layout) ship.addBlock(b.typeId, b.gx, b.gy);
  ship.recalcStats();
  ship.hp       = ship.stats.maxHp;
  ship.shieldHp = ship.stats.shieldMax;
  return ship;
}

function releaseEnemy(ship) {
  ship.alive = false;
  _freeShips.push(ship);
}

class EnemyManager {
  constructor() {
    this._enemies = [];   // { ship, ai }
    this._ships   = [];   // parallel array — no alloc on get ships
  }

  spawn(x, y) {
    const dist = Math.sqrt(x * x + y * y);
    const tier = Math.min(Math.floor(dist / 2000), LAYOUTS.length - 1);
    const ship = acquireEnemy(x, y, tier);
    const ai   = new EnemyAI(ship);
    this._enemies.push({ ship, ai });
    this._ships.push(ship);
    return ship;
  }

  update(dt, playerX, playerY, fireCallback) {
    const despSq = ENEMY_DESPAWN_DIST * ENEMY_DESPAWN_DIST;
    for (let i = this._enemies.length - 1; i >= 0; i--) {
      const { ship, ai } = this._enemies[i];
      if (!ship.alive || dist2(ship.x, ship.y, playerX, playerY) > despSq) {
        releaseEnemy(ship);
        this._enemies.splice(i, 1);
        this._ships.splice(i, 1);
        continue;
      }
      ship.update(dt);
      ai.update(dt, playerX, playerY, fireCallback);
    }
  }

  draw(ctx) {
    for (const { ship } of this._enemies) {
      ship.drawShield(ctx);
      ship.draw(ctx);
    }
  }

  get ships() { return this._ships; }
}

// ═══ src/effects/EffectsSystem.js ═══
// src/effects/EffectsSystem.js — pooled particle effects system

// ── Particle ───────────────────────────────────────────────────────────────

class Particle {
  constructor() {
    this.x = 0; this.y = 0;
    this.vx = 0; this.vy = 0;
    this.life = 0; this.maxLife = 1;
    this.r = 3;
    this.r0 = 0; // start radius
    this.cr = 255; this.cg = 200; this.cb = 60;  // colour
    this.alive = false;
    this._pooled = false;
  }

  init(x, y, vx, vy, life, r, cr, cg, cb) {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.life = life; this.maxLife = life;
    this.r = r; this.r0 = r;
    this.cr = cr; this.cg = cg; this.cb = cb;
    this._col = `rgb(${cr},${cg},${cb})`;
    this.alive = true;
  }

  update(dt) {
    this.x    += this.vx * dt;
    this.y    += this.vy * dt;
    this.vx   *= 0.96;
    this.vy   *= 0.96;
    this.life -= dt;
    if (this.life <= 0) this.alive = false;
  }

  draw(ctx) {
    if (!this.alive) return;
    const t = this.life / this.maxLife;
    ctx.globalAlpha = t;
    ctx.fillStyle   = this._col;
    ctx.beginPath();
    ctx.arc(this.x, this.y, Math.max(this.r * t, 0.5), 0, Math.PI * 2);
    ctx.fill();
  }
}

// ── Pool ───────────────────────────────────────────────────────────────────

const particlePool = new Pool(
  () => new Particle(),
  (p) => { p.alive = false; }
);
particlePool.prewarm(150);

const _particles = [];

// Pre-allocated colour sets to avoid string building in hot path
const COLORS = {
  explosion: [255, 160, 40],
  shield:    [80,  120, 255],
  drill:     [255, 180, 30],
  engine:    [60,  180, 255],
  spark:     [255, 240, 80],
};

function _emit(x, y, cr, cg, cb, count, speed, life, size) {
  for (let i = 0; i < count; i++) {
    const a  = Math.random() * Math.PI * 2;
    const s  = speed * (0.4 + Math.random() * 0.8);
    const p  = particlePool.get();
    p.init(x, y, Math.cos(a) * s, Math.sin(a) * s, life * (0.5 + Math.random() * 0.8), size * (0.5 + Math.random()), cr, cg, cb);
    _particles.push(p);
  }
}

const Effects = {
  explosion(x, y, scale = 1) {
    const [cr, cg, cb] = COLORS.explosion;
    _emit(x, y, cr, cg, cb,     Math.ceil(18 * scale), 150 * scale, 0.6, 6 * scale);
    _emit(x, y, 255, 80, 20,   Math.ceil(10 * scale), 80  * scale, 0.9, 4 * scale);
    _emit(x, y, 255, 255, 200, Math.ceil(6  * scale), 200 * scale, 0.3, 3 * scale);
  },

  shieldHit(x, y) {
    const [cr, cg, cb] = COLORS.shield;
    _emit(x, y, cr, cg, cb, 8, 120, 0.4, 4);
  },

  drillSpark(x, y) {
    const [cr, cg, cb] = COLORS.drill;
    _emit(x, y, cr, cg, cb, 4, 80, 0.25, 2);
  },

  engineTrail(x, y) {
    const [cr, cg, cb] = COLORS.engine;
    _emit(x, y, cr, cg, cb, 2, 30, 0.2, 3);
  },

  update(dt) {
    for (let i = _particles.length - 1; i >= 0; i--) {
      const p = _particles[i];
      p.update(dt);
      if (!p.alive) {
        particlePool.release(p);
        _particles.splice(i, 1);
      }
    }
  },

  draw(ctx) {
    ctx.save();
    for (const p of _particles) p.draw(ctx);
    ctx.restore();
  },

  get count() { return _particles.length; },
};
