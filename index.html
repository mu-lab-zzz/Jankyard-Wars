// ═══ src/craft/CraftSystem.js ═══
// src/craft/CraftSystem.js — crafting logic (uses station materials)

class CraftSystem {
  constructor(inventory) {
    this._inv = inventory;
  }

  /** Returns RECIPES annotated with canCraft flag. */
  getAnnotatedRecipes() {
    return RECIPES.map(r => ({
      ...r,
      canCraft: this._inv.canAffordMat(r.cost),
    }));
  }

  /** Try to craft one item of recipe `id`. Returns true on success. */
  craft(recipeId) {
    const recipe = RECIPES.find(r => r.id === recipeId);
    if (!recipe) return false;
    if (!this._inv.spendMat(recipe.cost)) return false;
    this._inv.addBlock(recipe.id, recipe.output);
    return true;
  }

  /** Format MAT cost as human-readable string. */
  static costLabel(cost) {
    return Object.entries(cost)
      .map(([id, n]) => `${MAT_NAMES[id] ?? id}×${n}`)
      .join(', ');
  }
}

// ═══ src/ui/HUD.js ═══
// src/ui/HUD.js — in-game HUD drawn directly on canvas

const ORE_ORDER = [ORE.IRON, ORE.COPPER, ORE.CRYSTAL, ORE.TITANIUM, ORE.DARK_MATTER];

function drawBar(ctx, x, y, w, h, value, maxVal, fillColor, bgColor) {
  ctx.fillStyle = bgColor ?? 'rgba(0,0,0,0.5)';
  ctx.fillRect(x, y, w, h);
  if (maxVal > 0) {
    const ratio = Math.max(0, Math.min(1, value / maxVal));
    ctx.fillStyle = fillColor;
    ctx.fillRect(x, y, w * ratio, h);
  }
  ctx.strokeStyle = '#1a3050';
  ctx.lineWidth   = 1;
  ctx.strokeRect(x, y, w, h);
}

class HUD {
  constructor() {
    this._fps      = 0;
    this._fpsTimer = 0;
    this._frames   = 0;
  }

  update(dt) {
    this._fpsTimer += dt;
    this._frames++;
    if (this._fpsTimer >= 1) {
      this._fps      = this._frames;
      this._frames   = 0;
      this._fpsTimer = 0;
    }
  }

  /**
   * @param {CanvasRenderingContext2D} ctx
   * @param {number} cw
   * @param {number} ch
   * @param {Ship} playerShip
   * @param {Inventory} inventory
   * @param {Camera} camera
   * @param {World} world
   * @param {EnemyManager} enemies
   * @param {Station} station
   * @param {Input} input
   */
  draw(ctx, cw, ch, playerShip, inventory, camera, world, enemies, station, input) {
    this._drawShipStatus(ctx, playerShip, inventory);
    this._drawCargo(ctx, cw, ch, inventory);
    this._drawSpeed(ctx, cw, playerShip);
    this._drawMinimap(ctx, cw, ch, playerShip, world, enemies, station);
    this._drawStationProximity(ctx, cw, ch, playerShip, station);
    this._drawKeyHints(ctx, cw, ch);
    if (input) this._drawJoystick(ctx, input);

    ctx.fillStyle = 'rgba(80,120,100,0.6)';
    ctx.font      = '10px monospace';
    ctx.fillText(`${this._fps} FPS`, cw - 48, 12);
  }

  _drawShipStatus(ctx, ship, inventory) {
    if (!ship || !ship.stats) return;
    const x = 12, y = 12;
    const bw = 140, bh = 10;

    ctx.fillStyle = '#8ab0d0';
    ctx.font      = 'bold 11px monospace';
    ctx.fillText('HP', x, y + 9);
    drawBar(ctx, x + 22, y, bw, bh, ship.hp, ship.stats.maxHp,
      ship.hp / ship.stats.maxHp > 0.3 ? C.HP_BAR : C.HP_LOW,
      'rgba(0,0,0,0.5)'
    );
    ctx.fillStyle = '#a0c0d0';
    ctx.font      = '9px monospace';
    ctx.fillText(`${Math.ceil(ship.hp)}/${ship.stats.maxHp}`, x + 22 + bw + 4, y + 9);

    if (ship.shieldMax > 0) {
      ctx.fillStyle = '#8ab0d0';
      ctx.font      = 'bold 11px monospace';
      ctx.fillText('SH', x, y + 24);
      drawBar(ctx, x + 22, y + 14, bw, bh, ship.shieldHp, ship.shieldMax, C.SHIELD_BAR, 'rgba(0,0,0,0.5)');
      ctx.fillStyle = '#a0c0d0';
      ctx.font      = '9px monospace';
      ctx.fillText(`${Math.ceil(ship.shieldHp)}/${ship.shieldMax}`, x + 22 + bw + 4, y + 23);
    }

    if (ship.stats.powerGen > 0 || ship.stats.powerDraw > 0) {
      const bal = ship.stats.powerBalance;
      ctx.fillStyle = bal >= 0 ? '#60ff80' : '#ff6040';
      ctx.font      = '10px monospace';
      ctx.fillText(`⚡ ${bal >= 0 ? '+' : ''}${bal | 0}`, x, y + 40);
    }
  }

  _drawCargo(ctx, cw, ch, inventory) {
    const used = inventory.cargoUsed;
    const cap  = inventory.cargoCapacity;
    const full = used >= cap;
    const x = 12, y = 56;
    const bw = 140, bh = 10;

    ctx.fillStyle = full ? C.CARGO_FULL : C.CARGO_BAR;
    ctx.font      = 'bold 11px monospace';
    ctx.fillText('積荷', x, y + 9);

    drawBar(ctx, x + 36, y, bw, bh, used, cap,
      full ? C.CARGO_FULL : C.CARGO_BAR,
      'rgba(0,0,0,0.5)'
    );
    ctx.fillStyle = '#a0c0a0';
    ctx.font      = '9px monospace';
    ctx.fillText(`${used}/${cap}`, x + 36 + bw + 4, y + 9);

    // Ore breakdown at bottom
    const by = ch - 10;
    let cx2  = 12;
    ctx.font = '10px monospace';
    for (const oreId of ORE_ORDER) {
      const count = inventory.getCargo(oreId);
      if (count <= 0) continue;
      ctx.fillStyle = ORE_COLORS[oreId] ?? '#ffffff';
      const label   = `${ORE_NAMES[oreId] ?? oreId}:${count}`;
      ctx.fillText(label, cx2, by);
      cx2 += ctx.measureText(label).width + 12;
    }
  }

  _drawSpeed(ctx, cw, ship) {
    if (!ship) return;
    const spd = Math.sqrt(ship.vx * ship.vx + ship.vy * ship.vy) | 0;
    ctx.fillStyle = '#7090a0';
    ctx.font      = '10px monospace';
    ctx.fillText(`${spd} u/s`, cw - 60, 24);
  }

  _drawStationProximity(ctx, cw, ch, ship, station) {
    if (!ship || !station) return;
    const d2    = dist2(ship.x, ship.y, station.x, station.y);
    const dockR = STATION_DOCK_RANGE;
    if (d2 > dockR * dockR) return;

    const dist   = Math.sqrt(d2) | 0;
    const inner  = dist2(ship.x, ship.y, station.x, station.y) < STATION_INNER_RANGE * STATION_INNER_RANGE;
    const blink  = (Math.sin(Date.now() * 0.005) > 0);
    const col    = inner ? C.DOCK_ACTIVE : (blink ? '#ffe060' : '#a0c080');

    ctx.fillStyle = col;
    ctx.font      = 'bold 13px monospace';
    ctx.textAlign = 'center';
    const label   = inner
      ? '🛸 ドック接続中'
      : `🛸 ステーション ${dist}m [E]でドック`;
    ctx.fillText(label, cw * 0.5, ch - 48);
    ctx.textAlign = 'left';
  }

  _drawMinimap(ctx, cw, ch, playerShip, world, enemies, station) {
    const mmW = 120, mmH = 120;
    const mmX = cw - mmW - 8;
    const mmY = ch - mmH - 8;
    const scale = 1 / 6;

    ctx.fillStyle   = 'rgba(0,6,16,0.75)';
    ctx.fillRect(mmX, mmY, mmW, mmH);
    ctx.strokeStyle = C.HUD_BORDER;
    ctx.lineWidth   = 1;
    ctx.strokeRect(mmX, mmY, mmW, mmH);

    const cx = mmX + mmW / 2;
    const cy = mmY + mmH / 2;
    const px = playerShip?.x ?? 0;
    const py = playerShip?.y ?? 0;

    // Station dot (cyan)
    if (station) {
      const sx = cx + (station.x - px) * scale;
      const sy = cy + (station.y - py) * scale;
      if (sx >= mmX && sx <= mmX + mmW && sy >= mmY && sy <= mmY + mmH) {
        ctx.fillStyle = '#40d8ff';
        ctx.beginPath();
        ctx.arc(sx, sy, 4, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Asteroids
    ctx.fillStyle = '#605040';
    for (const a of world.asteroids) {
      const ax = cx + (a.x - px) * scale;
      const ay = cy + (a.y - py) * scale;
      if (ax >= mmX && ax <= mmX + mmW && ay >= mmY && ay <= mmY + mmH) {
        ctx.fillRect(ax - 1, ay - 1, 2, 2);
      }
    }

    // Enemies
    ctx.fillStyle = '#ff4020';
    for (const ship of enemies.ships) {
      const ex = cx + (ship.x - px) * scale;
      const ey = cy + (ship.y - py) * scale;
      if (ex >= mmX && ex <= mmX + mmW && ey >= mmY && ey <= mmY + mmH) {
        ctx.fillRect(ex - 2, ey - 2, 4, 4);
      }
    }

    // Drops
    ctx.fillStyle = '#40e060';
    for (const d of world.drops) {
      const dx = cx + (d.x - px) * scale;
      const dy = cy + (d.y - py) * scale;
      if (dx >= mmX && dx <= mmX + mmW && dy >= mmY && dy <= mmY + mmH) {
        ctx.fillRect(dx - 1, dy - 1, 2, 2);
      }
    }

    // Player arrow
    ctx.fillStyle = '#ffffff';
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(playerShip?.angle ?? 0);
    ctx.beginPath();
    ctx.moveTo(5, 0); ctx.lineTo(-4, -3); ctx.lineTo(-4, 3);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  _drawKeyHints(ctx, cw, ch) {
    ctx.fillStyle = 'rgba(60,80,100,0.5)';
    ctx.font      = '9px monospace';
    ctx.fillText('[WASD]移動  [クリック/右側タップ]射撃  [E]ドリル/ドック  [Esc]設定', 12, ch - 24);
  }

  _drawJoystick(ctx, input) {
    if (input._joyId < 0) return; // no active touch on left side
    const ox   = input.joyOriginX;
    const oy   = input.joyOriginY;
    const jx   = input.joyX;
    const jy   = input.joyY;
    const maxR = 50;

    // Base ring
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = '#6090c0';
    ctx.lineWidth   = 2;
    ctx.beginPath();
    ctx.arc(ox, oy, maxR, 0, Math.PI * 2);
    ctx.stroke();

    // Knob
    ctx.fillStyle = 'rgba(80,160,220,0.5)';
    ctx.beginPath();
    ctx.arc(ox + jx * maxR, oy + jy * maxR, 18, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#80c0ff';
    ctx.lineWidth   = 1.5;
    ctx.stroke();
    ctx.restore();
  }
}

// ═══ src/ui/BuildUI.js ═══
// src/ui/BuildUI.js — ship builder DOM overlay

class BuildUI {
  constructor(canvas, ship, inventory, onDone) {
    this._canvas    = canvas;
    this._ship      = ship;
    this._inventory = inventory;
    this._onDone    = onDone;
    this._selectedType = BID.ARMOR;
    this._mode      = 'place'; // 'place' | 'delete'
    this._craftSys  = new CraftSystem(inventory);

    this._ui       = document.getElementById('build-ui');
    this._palette  = document.getElementById('build-palette');
    this._statsEl  = document.getElementById('build-stats');
    this._doneBtn  = document.getElementById('btn-build-done');
    this._clearBtn = document.getElementById('btn-build-clear');

    // Canvas for grid rendering (reuse main canvas)
    this._ctx = canvas.getContext('2d');

    this._bound_onPointerDown = this._onPointerDown.bind(this);
    this._bound_onContextMenu = (e) => e.preventDefault();

    this._paletteCards = new Map(); // typeId -> DOM element
    this._buildPalette();
    this._doneBtn.addEventListener('click', () => this._onDone());
    this._clearBtn.addEventListener('click', () => this._clearAll());
  }

  _buildPalette() {
    this._palette.innerHTML = '';
    this._paletteCards.clear();

    for (const def of allDefs()) {
      if (def.id === BID.CORE) continue; // core cannot be added from palette
      const card = document.createElement('div');
      card.className = 'palette-block';
      card.title = def.name;

      // Small preview canvas
      const previewCv = document.createElement('canvas');
      previewCv.width = 36; previewCv.height = 36;
      const pCtx = previewCv.getContext('2d');
      const sprite = getBlockSprite(def.id);
      if (sprite) pCtx.drawImage(sprite, 0, 0, 36, 36);
      card.appendChild(previewCv);

      const label = document.createElement('div');
      label.textContent = def.name;
      card.appendChild(label);

      const countEl = document.createElement('div');
      countEl.style.color = '#60e080';
      countEl.style.fontSize = '9px';
      card.appendChild(countEl);

      card.addEventListener('click', () => this._selectType(def.id));
      this._palette.appendChild(card);
      this._paletteCards.set(def.id, { card, countEl });
    }

    this._selectType(this._selectedType);
  }

  _selectType(typeId) {
    this._selectedType = typeId;
    for (const [id, { card }] of this._paletteCards) {
      card.classList.toggle('selected', id === typeId);
    }
  }

  _clearAll() {
    const toDelete = [];
    for (const blk of this._ship.blocks.values()) {
      if (blk.typeId !== BID.CORE) toDelete.push({ gx: blk.gx, gy: blk.gy });
    }
    for (const { gx, gy } of toDelete) this._ship.removeBlock(gx, gy);
    this._updateStats();
  }

  // ── Grid interaction ─────────────────────────────────────────────────────

  _onPointerDown(e) {
    if (e.target !== this._canvas) return;
    e.preventDefault();

    const r    = this._canvas.getBoundingClientRect();
    const scX  = this._canvas.width  / r.width;
    const scY  = this._canvas.height / r.height;
    const sx   = (e.clientX - r.left) * scX;
    const sy   = (e.clientY - r.top)  * scY;

    // Transform screen → ship-local grid
    const cw   = this._canvas.width;
    const ch   = this._canvas.height;
    const lx   = sx - cw / 2;
    const ly   = sy - ch / 2;
    const gx   = Math.round(lx / BS);
    const gy   = Math.round(ly / BS);

    if (e.button === 2 || e.buttons === 2) {
      // Right-click: delete
      this._ship.removeBlock(gx, gy);
    } else {
      // Left-click: place
      if (gx === 0 && gy === 0) return; // can't overwrite core
      // Check stock
      const count = this._inventory.getBlocks(this._selectedType);
      if (count <= 0) {
        // Flash indicator
        return;
      }
      if (this._ship.addBlock(this._selectedType, gx, gy)) {
        this._inventory.spendBlock(this._selectedType, 1);
      }
    }

    this._updateStats();
    this._updatePaletteCounters();
  }

  // ── Draw build view ──────────────────────────────────────────────────────

  draw() {
    const ctx  = this._ctx;
    const cw   = this._canvas.width;
    const ch   = this._canvas.height;

    // Background
    ctx.fillStyle = '#06090f';
    ctx.fillRect(0, 0, cw, ch);

    // Grid
    const gridCells = 20;
    const offX = cw / 2 % BS;
    const offY = ch / 2 % BS;
    ctx.strokeStyle = 'rgba(30,50,80,0.5)';
    ctx.lineWidth   = 0.5;
    for (let x = offX; x < cw; x += BS) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, ch); ctx.stroke();
    }
    for (let y = offY; y < ch; y += BS) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(cw, y); ctx.stroke();
    }

    // Centre cross
    ctx.strokeStyle = 'rgba(60,100,140,0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cw/2, 0); ctx.lineTo(cw/2, ch); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, ch/2); ctx.lineTo(cw, ch/2); ctx.stroke();

    // Draw ship blocks
    ctx.save();
    ctx.translate(cw / 2, ch / 2);
    for (const blk of this._ship.blocks.values()) {
      const px = blk.gx * BS - BS / 2;
      const py = blk.gy * BS - BS / 2;
      const sprite = getBlockSprite(blk.typeId);
      if (sprite) ctx.drawImage(sprite, px, py, BS, BS);
      // Highlight selected type
      if (blk.typeId === this._selectedType) {
        ctx.strokeStyle = '#60c0ff';
        ctx.lineWidth   = 1.5;
        ctx.strokeRect(px, py, BS, BS);
      }
    }

    // Ghost block at cursor (if hovering)
    if (this._hoverGX !== undefined) {
      const sprite = getBlockSprite(this._selectedType);
      if (sprite) {
        ctx.globalAlpha = 0.45;
        ctx.drawImage(sprite, this._hoverGX * BS - BS / 2, this._hoverGY * BS - BS / 2, BS, BS);
        ctx.globalAlpha = 1;
      }
    }
    ctx.restore();
  }

  _updateStats() {
    this._ship.recalcStats();
    const s = this._ship.stats;
    if (!s || !this._statsEl) return;
    this._statsEl.innerHTML =
      `<b>ブロック数</b>: ${s.blockCount}<br>` +
      `<b>重量</b>: ${s.mass}<br>` +
      `<b>推力</b>: ${s.thrust | 0}<br>` +
      `<b>耐久力</b>: ${s.maxHp}<br>` +
      `<b>シールド</b>: ${s.shieldMax}<br>` +
      `<b>発電量</b>: ${s.powerGen} / 消費${s.powerDraw}<br>` +
      `<b>積載量</b>: ${s.cargoCapacity}<br>` +
      `<b>武器数</b>: ${s.weaponCount}<br>`;
  }

  _updatePaletteCounters() {
    for (const [typeId, { countEl }] of this._paletteCards) {
      const n = this._inventory.getBlocks(typeId);
      countEl.textContent = `×${n}`;
      countEl.style.color = n > 0 ? '#60e080' : '#804040';
    }
  }

  // ── Lifecycle ─────────────────────────────────────────────────────────────

  show() {
    this._ui.classList.add('active');
    this._canvas.addEventListener('pointerdown', this._bound_onPointerDown);
    this._canvas.addEventListener('contextmenu', this._bound_onContextMenu);
    this._canvas.addEventListener('pointermove', this._onPointerMove = (e) => {
      const r   = this._canvas.getBoundingClientRect();
      const scX = this._canvas.width  / r.width;
      const scY = this._canvas.height / r.height;
      const sx  = (e.clientX - r.left) * scX;
      const sy  = (e.clientY - r.top)  * scY;
      this._hoverGX = Math.round((sx - this._canvas.width  / 2) / BS);
      this._hoverGY = Math.round((sy - this._canvas.height / 2) / BS);
    });
    this._updateStats();
    this._updatePaletteCounters();
  }

  hide() {
    this._ui.classList.remove('active');
    this._canvas.removeEventListener('pointerdown', this._bound_onPointerDown);
    this._canvas.removeEventListener('contextmenu', this._bound_onContextMenu);
    if (this._onPointerMove) {
      this._canvas.removeEventListener('pointermove', this._onPointerMove);
      this._onPointerMove = null;
    }
    this._hoverGX = undefined;
    this._hoverGY = undefined;
    this._ship.recalcStats();
  }
}

// src/ui/StationUI.js — station overlay: deposit/refine, craft, dock tabs

class StationUI {
  constructor(inventory, onClose, onEnterDock) {
    this._inv        = inventory;
    this._onClose    = onClose;
    this._onEnterDock= onEnterDock;
    this._craft      = new CraftSystem(inventory);
    this._activeTab  = 'refine';

    this._overlay    = document.getElementById('station-overlay');
    this._closeBtn   = document.getElementById('btn-station-close');
    this._depositBtn = document.getElementById('btn-deposit-all');
    this._dockBtn    = document.getElementById('btn-enter-build');

    this._panels = {
      refine: document.getElementById('station-panel-refine'),
      craft:  document.getElementById('station-panel-craft'),
      dock:   document.getElementById('station-panel-dock'),
    };

    this._closeBtn?.addEventListener('click', () => this._onClose());
    this._depositBtn?.addEventListener('click', () => {
      this._inv.depositAllOre();
      this._refresh();
    });
    this._dockBtn?.addEventListener('click', () => {
      this._onEnterDock();
    });

    document.querySelectorAll('.station-tab-btn').forEach(btn => {
      btn.addEventListener('click', () => this._switchTab(btn.dataset.tab));
    });
  }

  show() {
    this._overlay?.classList.add('active');
    this._switchTab('refine');
    this._refresh();
  }

  hide() {
    this._overlay?.classList.remove('active');
  }

  _switchTab(tab) {
    this._activeTab = tab;
    document.querySelectorAll('.station-tab-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tab === tab);
    });
    for (const [key, panel] of Object.entries(this._panels)) {
      if (panel) panel.classList.toggle('hidden', key !== tab);
    }
    this._refresh();
  }

  _refresh() {
    if (this._activeTab === 'refine') this._refreshRefine();
    if (this._activeTab === 'craft')  this._refreshCraft();
    if (this._activeTab === 'dock')   this._refreshDock();
  }

  _refreshRefine() {
    const inv = this._inv;

    // Cargo summary
    const cargoEl = document.getElementById('station-cargo-info');
    if (cargoEl) {
      let html = `<div class="stat-row"><b>積荷</b>: ${inv.cargoUsed} / ${inv.cargoCapacity}</div>`;
      for (const [id, count] of inv.cargoEntries()) {
        if (count <= 0) continue;
        const col  = ORE_COLORS[id] ?? '#fff';
        const name = ORE_NAMES[id] ?? id;
        html += `<div class="ore-row" style="color:${col}">${name}: ${count}</div>`;
      }
      cargoEl.innerHTML = html || '<div style="color:#405060">積荷なし</div>';
    }

    // Station ore stocks + refine buttons
    const oreList = document.getElementById('station-ore-list');
    if (oreList) {
      oreList.innerHTML = '<div class="section-title">ステーション在庫 / 精製</div>';
      for (const recipe of REFINE_RECIPES) {
        const have    = inv.getStationOre(recipe.oreId);
        const canMake = Math.floor(have / recipe.orePerMat);
        const matHave = inv.getMat(recipe.matId);
        const col     = ORE_COLORS[recipe.oreId] ?? '#fff';
        const matCol  = MAT_COLORS[recipe.matId] ?? '#fff';
        const matName = MAT_NAMES[recipe.matId]  ?? recipe.matId;
        const oreName = ORE_NAMES[recipe.oreId]  ?? recipe.oreId;

        const row = document.createElement('div');
        row.className = 'refine-row';
        row.innerHTML =
          `<span style="color:${col}">${oreName}: ${have}</span>` +
          ` → <span style="color:${matCol}">${matName}: ${matHave}</span>` +
          `<button class="btn${canMake > 0 ? ' primary' : ''}" ${canMake <= 0 ? 'disabled' : ''}` +
          ` data-ore="${recipe.oreId}" data-mat="${recipe.matId}" data-ratio="${recipe.orePerMat}">` +
          `精製 (×${recipe.orePerMat}→1)</button>`;

        row.querySelector('button').addEventListener('click', (e) => {
          const btn = e.currentTarget;
          inv.refineOre(btn.dataset.ore, btn.dataset.mat, Number(btn.dataset.ratio));
          this._refreshRefine();
        });
        oreList.appendChild(row);
      }
    }
  }

  _refreshCraft() {
    // Material summary
    const matList = document.getElementById('station-mat-list');
    if (matList) {
      matList.innerHTML = '<div class="section-title">材料在庫</div>';
      let any = false;
      for (const [id, n] of this._inv.matEntries()) {
        if (n <= 0) continue;
        const col  = MAT_COLORS[id] ?? '#fff';
        const name = MAT_NAMES[id]  ?? id;
        matList.innerHTML += `<span class="mat-chip" style="color:${col}">${name}×${n}</span>`;
        any = true;
      }
      if (!any) matList.innerHTML += '<span style="color:#405060">材料なし</span>';
    }

    // Recipe cards
    const grid = document.getElementById('station-recipe-grid');
    if (!grid) return;
    grid.innerHTML = '';

    for (const recipe of this._craft.getAnnotatedRecipes()) {
      const card = document.createElement('div');
      card.className = 'recipe-card' + (recipe.canCraft ? ' can-craft' : '');

      const cv = document.createElement('canvas');
      cv.width = 36; cv.height = 36;
      cv.style.cssText = 'display:block;margin:0 auto 6px';
      const sprite = getBlockSprite(recipe.id);
      if (sprite) cv.getContext('2d').drawImage(sprite, 0, 0, 36, 36);
      card.appendChild(cv);

      const nameEl = document.createElement('div');
      nameEl.className   = 'recipe-name';
      nameEl.textContent = recipe.name;
      card.appendChild(nameEl);

      const costEl = document.createElement('div');
      costEl.className   = 'recipe-cost';
      costEl.textContent = CraftSystem.costLabel(recipe.cost);
      card.appendChild(costEl);

      const stockEl = document.createElement('div');
      stockEl.className   = 'recipe-count';
      stockEl.textContent = `所持: ${this._inv.getBlocks(recipe.id)}`;
      card.appendChild(stockEl);

      const btn = document.createElement('button');
      btn.className   = 'btn' + (recipe.canCraft ? ' primary' : '');
      btn.textContent = '製造';
      btn.disabled    = !recipe.canCraft;
      btn.addEventListener('click', () => {
        if (this._craft.craft(recipe.id)) this._refreshCraft();
      });
      card.appendChild(btn);

      grid.appendChild(card);
    }
  }

  _refreshDock() {
    const dockInfo = document.getElementById('station-dock-info');
    if (dockInfo) {
      const s = this._inv;
      dockInfo.innerHTML =
        `<div class="stat-row">積荷: ${s.cargoUsed} / ${s.cargoCapacity}</div>`;
    }
  }
}

// src/ui/UIManager.js — screen / overlay management

class UIManager {
  constructor() {
    this._screen    = SCREEN.GAME;
    this._listeners = new Map();

    this._overlays = {
      [SCREEN.STATION]:  document.getElementById('station-overlay'),
      [SCREEN.SETTINGS]: document.getElementById('settings-overlay'),
      [SCREEN.GAMEOVER]: document.getElementById('gameover-overlay'),
    };

    document.getElementById('btn-settings-close')?.addEventListener('click', () => {
      this.switchTo(SCREEN.GAME);
    });

    document.getElementById('btn-restart')?.addEventListener('click', () => {
      this._emit('restart');
    });
  }

  onEvent(name, fn) { this._listeners.set(name, fn); }
  _emit(name)       { this._listeners.get(name)?.(); }

  get current() { return this._screen; }

  switchTo(screen) {
    for (const el of Object.values(this._overlays)) {
      if (el) el.classList.remove('active');
    }
    this._screen = screen;
    const el = this._overlays[screen];
    if (el) el.classList.add('active');
    this._emit('screenChange');
    return this;
  }

  showGameOver() { this.switchTo(SCREEN.GAMEOVER); }

  bindSettingsSaveLoad(onSave, onLoad) {
    document.getElementById('btn-settings-save')?.addEventListener('click', onSave);
    document.getElementById('btn-settings-load')?.addEventListener('click', onLoad);
  }
}

// ═══ src/save/SaveSystem.js ═══
// src/save/SaveSystem.js — JSON save / load via localStorage + file download

const LS_KEY = 'jankyard_wars_save';

class SaveSystem {
  /** Serialize game state to a plain object. */
  static buildSave(playerShip, inventory, camera) {
    return {
      version:   2,
      timestamp: Date.now(),
      ship:      playerShip.toJSON(),
      inventory: inventory.toJSON(),
      camera:    { x: camera.x, y: camera.y },
    };
  }

  /** Save to localStorage. Returns true on success. */
  static saveLocal(playerShip, inventory, camera) {
    try {
      const data = SaveSystem.buildSave(playerShip, inventory, camera);
      localStorage.setItem(LS_KEY, JSON.stringify(data));
      return true;
    } catch (e) {
      console.warn('Save failed:', e);
      return false;
    }
  }

  /** Download save as a JSON file. */
  static downloadSave(playerShip, inventory, camera) {
    const data = SaveSystem.buildSave(playerShip, inventory, camera);
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = `jankyard_wars_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  /** Load from localStorage. Returns parsed object or null. */
  static loadLocal() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  /** Prompt user to select a JSON file, return parsed data via callback. */
  static loadFromFile(callback) {
    const input  = document.createElement('input');
    input.type   = 'file';
    input.accept = 'application/json';
    input.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const text = await file.text();
        callback(JSON.parse(text));
      } catch (err) {
        console.error('Load failed:', err);
      }
    };
    input.click();
  }

  /** Apply loaded data to game objects. Mutates ship, inventory, camera. */
  static applyLoad(data, playerShip, inventory, camera) {
    if (!data || data.version < 2) return false;
    try {
      // Rebuild ship
      playerShip.blocks.clear();
      playerShip._statsDirty  = true;
      playerShip._spriteDirty = true;
      for (const b of data.ship.blocks) {
        playerShip.addBlock(b.typeId, b.gx, b.gy);
        const blk = playerShip.getBlock(b.gx, b.gy);
        if (blk && b.hp !== undefined) blk.hp = b.hp;
      }
      playerShip.x     = data.ship.x     ?? 0;
      playerShip.y     = data.ship.y     ?? 0;
      playerShip.angle = data.ship.angle ?? 0;
      playerShip.vx    = data.ship.vx    ?? 0;
      playerShip.vy    = data.ship.vy    ?? 0;
      playerShip.recalcStats();
      playerShip.shieldHp = playerShip.shieldMax;

      inventory.fromJSON(data.inventory);

      if (data.camera) {
        camera.x = data.camera.x;
        camera.y = data.camera.y;
        camera.tx = camera.x;
        camera.ty = camera.y;
      }
      return true;
    } catch (e) {
      console.error('Apply save failed:', e);
      return false;
    }
  }
}

// src/Game.js — main game controller: loop, state machine, systems coordination

// ── Star field ────────────────────────────────────────────────────────────────

const _starX    = new Float32Array(STAR_COUNT);
const _starY    = new Float32Array(STAR_COUNT);
const _starType = new Uint8Array(STAR_COUNT);
const STAR_COLS = [C.STAR_DIM, C.STAR_MED, C.STAR_BRIGHT];

function _initStars() {
  for (let i = 0; i < STAR_COUNT; i++) {
    _starX[i]    = Math.random() * STAR_VIRTUAL;
    _starY[i]    = Math.random() * STAR_VIRTUAL;
    _starType[i] = Math.random() < 0.6 ? 0 : (Math.random() < 0.7 ? 1 : 2);
  }
}

function _drawStars(ctx, camX, camY, cw, ch) {
  const px = 0.04;
  const ox = ((camX * px) % STAR_VIRTUAL + STAR_VIRTUAL) % STAR_VIRTUAL;
  const oy = ((camY * px) % STAR_VIRTUAL + STAR_VIRTUAL) % STAR_VIRTUAL;

  for (let c = 0; c < 3; c++) {
    ctx.fillStyle = STAR_COLS[c];
    const sz = c === 2 ? 2 : 1;
    for (let i = c; i < STAR_COUNT; i += 3) {
      let x = ((_starX[i] - ox + STAR_VIRTUAL * 4) % STAR_VIRTUAL);
      let y = ((_starY[i] - oy + STAR_VIRTUAL * 4) % STAR_VIRTUAL);
      for (let tx = 0; x + tx * STAR_VIRTUAL < cw + STAR_VIRTUAL; tx++) {
        for (let ty = 0; y + ty * STAR_VIRTUAL < ch + STAR_VIRTUAL; ty++) {
          const sx = x + tx * STAR_VIRTUAL;
          const sy = y + ty * STAR_VIRTUAL;
          if (sx >= -2 && sx <= cw + 2 && sy >= -2 && sy <= ch + 2) {
            ctx.fillRect(sx, sy, sz, sz);
          }
        }
      }
    }
  }
}

// ── Default player ship ────────────────────────────────────────────────────────

function _buildDefaultShip() {
  const ship = new Ship(0, -600, true); // Start away from station
  ship.addBlock(BID.CORE,      0,  0);
  ship.addBlock(BID.ARMOR,     0, -1);
  ship.addBlock(BID.ENGINE,   -2,  0);
  ship.addBlock(BID.ENGINE,   -2, -1);
  ship.addBlock(BID.WEAPON,    1,  0);
  ship.addBlock(BID.GENERATOR,-1,  1);
  ship.recalcStats();
  ship.hp       = ship.stats.maxHp;
  ship.shieldHp = 0;
  return ship;
}

// ── Game class ─────────────────────────────────────────────────────────────────

class Game {
  constructor(canvas) {
    this._canvas = canvas;
    this._ctx    = canvas.getContext('2d');

    this._screen  = SCREEN.GAME;
    this._running = false;
    this._docked  = false;

    this._lastTime    = 0;
    this._accumulator = 0;
    this._autoSaveTimer = 0;
    this._drillTimer    = 0;

    this.camera    = new Camera();
    this.input     = new Input(canvas);
    this.inventory = new Inventory();
    this.world     = new World(Math.random() * 999999 | 0);
    this.station   = new Station();
    this.enemies   = new EnemyManager();
    this.hud       = new HUD();

    this.player    = null;
    this._uiMgr    = new UIManager();
    this._buildUI  = null;
    this._stationUI= null;

    this._boundLoop = this._loop.bind(this);
  }

  // ── Initialise ──────────────────────────────────────────────────────────────

  async init() {
    this._resize();
    window.addEventListener('resize', () => this._resize());

    initSprites();
    this.world.init();
    _initStars();

    this.player = _buildDefaultShip();
    this._syncCargoCapacity();

    // Starter block stock (player starts with some blocks already crafted)
    this.inventory.addBlock(BID.ARMOR,     3);
    this.inventory.addBlock(BID.ENGINE,    1);
    this.inventory.addBlock(BID.WEAPON,    1);
    this.inventory.addBlock(BID.GENERATOR, 1);

    const saved = SaveSystem.loadLocal();
    if (saved) {
      SaveSystem.applyLoad(saved, this.player, this.inventory, this.camera);
      this._syncCargoCapacity();
    } else {
      this.camera.x  = this.player.x;
      this.camera.y  = this.player.y;
      this.camera.tx = this.player.x;
      this.camera.ty = this.player.y;
    }

    this._buildUI = new BuildUI(
      this._canvas, this.player, this.inventory,
      () => this._exitBuild()
    );

    this._stationUI = new StationUI(
      this.inventory,
      () => this._exitStation(),
      () => this._enterBuild()
    );

    this._uiMgr.onEvent('restart',      () => this._restart());
    this._uiMgr.onEvent('screenChange', () => { this._screen = this._uiMgr.current; });

    this._uiMgr.bindSettingsSaveLoad(
      () => SaveSystem.downloadSave(this.player, this.inventory, this.camera),
      () => SaveSystem.loadFromFile(data => {
        SaveSystem.applyLoad(data, this.player, this.inventory, this.camera);
        this._syncCargoCapacity();
        this._uiMgr.switchTo(SCREEN.GAME);
        this._screen = SCREEN.GAME;
      })
    );
  }

  // ── Game loop ───────────────────────────────────────────────────────────────

  start() {
    this._running  = true;
    this._lastTime = performance.now();
    requestAnimationFrame(this._boundLoop);
  }

  _loop(now) {
    if (!this._running) return;
    requestAnimationFrame(this._boundLoop);

    const rawDt = Math.min((now - this._lastTime) / 1000, MAX_DT);
    this._lastTime = now;

    if (this._screen === SCREEN.GAME) {
      this._accumulator += rawDt;
      while (this._accumulator >= FIXED_DT) {
        this._fixedUpdate(FIXED_DT);
        this._accumulator -= FIXED_DT;
      }
      this.hud.update(rawDt);
    }

    this.station.update(rawDt);
    this._render();
    this.input.flush();
  }

  // ── Fixed update ────────────────────────────────────────────────────────────

  _fixedUpdate(dt) {
    this._handleInput(dt);
    this.player.update(dt);

    // Sync cargo capacity whenever stats may have changed
    this._syncCargoCapacity();

    this.camera.follow(this.player.x, this.player.y);
    this.camera.update();

    this.world.update(this.player.x, this.player.y, dt, this.inventory);

    for (const spawn of this.world.drainEnemySpawns()) {
      this.enemies.spawn(spawn.x, spawn.y);
    }

    this.enemies.update(dt, this.player.x, this.player.y,
      (ship, tx, ty, isPlayer) => fireWeapons(ship, tx, ty, isPlayer)
    );

    updateBullets(dt);
    this._checkCollisions();
    Effects.update(dt);
    this._drillTimer -= dt;

    this._autoSaveTimer += dt;
    if (this._autoSaveTimer > 60) {
      SaveSystem.saveLocal(this.player, this.inventory, this.camera);
      this._autoSaveTimer = 0;
    }

    if (!this.player.alive) {
      this._screen = SCREEN.GAMEOVER;
      this._uiMgr.showGameOver();
    }
  }

  // ── Input handling ──────────────────────────────────────────────────────────

  _handleInput(dt) {
    const inp  = this.input;
    const ship = this.player;

    const fwd   = (inp.isDown('KeyW') || inp.isDown('ArrowUp'))    ? 1   : 0;
    const back  = (inp.isDown('KeyS') || inp.isDown('ArrowDown'))  ? 0.3 : 0;
    const left  = (inp.isDown('KeyA') || inp.isDown('ArrowLeft'))  ? 1   : 0;
    const right = (inp.isDown('KeyD') || inp.isDown('ArrowRight')) ? 1   : 0;

    const jx     = inp.joyX;
    const jy     = inp.joyY;
    const joyMag = Math.sqrt(jx * jx + jy * jy);

    let throttle = Math.max(fwd - back, 0);
    let torque   = right - left;

    if (joyMag > 0.1) {
      const cos = Math.cos(ship.angle), sin = Math.sin(ship.angle);
      const dot = jx * cos + jy * sin;
      throttle  = Math.max(dot, 0) * joyMag;
      const cross = jx * sin - jy * cos;
      torque    = cross * 3;
    }

    ship.applyThrust(throttle, torque, dt);

    const cw     = this._canvas.width;
    const ch     = this._canvas.height;
    const mouseWX = this.camera.toWX(inp.mouseX, cw);
    const mouseWY = this.camera.toWY(inp.mouseY, ch);

    const firing = inp.mouseDown(0) || inp.touchFire;
    const fireX  = inp.touchFire ? this.camera.toWX(inp.touchFireX, cw) : mouseWX;
    const fireY  = inp.touchFire ? this.camera.toWY(inp.touchFireY, ch) : mouseWY;
    if (firing) fireWeapons(ship, fireX, fireY, true);

    if (throttle > 0.1 && ship.stats && ship.stats.engineCount > 0) {
      for (const blk of ship.blocks.values()) {
        if (blk.typeId !== BID.ENGINE) continue;
        const cos = Math.cos(ship.angle), sin = Math.sin(ship.angle);
        const wx  = ship.x + blk.gx * BS * cos - blk.gy * BS * sin;
        const wy  = ship.y + blk.gx * BS * sin + blk.gy * BS * cos;
        Effects.engineTrail(wx - cos * BS * 0.8, wy - sin * BS * 0.8);
      }
    }

    if ((inp.isDown('KeyE') || inp.isDown('Space')) && this._drillTimer <= 0) {
      // If near station, dock instead of drill
      const d2 = dist2(ship.x, ship.y, this.station.x, this.station.y);
      if (d2 < STATION_INNER_RANGE * STATION_INNER_RANGE) {
        if (inp.justDown('KeyE') || inp.justDown('Space')) {
          this._enterStation();
        }
      } else {
        this._tryDrill();
        this._drillTimer = 0.12;
      }
    }

    if (inp.justDown('KeyB')) {
      // Build only while docked
      if (this._docked) this._enterBuild();
    }
    if (inp.justDown('Escape') || inp.justDown('KeyP')) this._enterSettings();
  }

  // ── Drill ───────────────────────────────────────────────────────────────────

  _tryDrill() {
    const ship = this.player;
    if (!ship.stats || ship.stats.drillCount === 0) return;

    const drillRange = 80 + BS * 1.5;
    const rangeSq    = drillRange * drillRange;
    let closestDist2 = Infinity;
    let closestAst   = null;

    for (const a of this.world.asteroids) {
      if (!a.alive) continue;
      const d2 = dist2(ship.x, ship.y, a.x, a.y);
      if (d2 < rangeSq && d2 < closestDist2) {
        closestDist2 = d2;
        closestAst   = a;
      }
    }

    if (closestAst) {
      let drillDmg = 0;
      for (const blk of ship.blocks.values()) {
        if (blk.typeId === BID.DRILL) drillDmg += 40;
      }
      const destroyed = this.world.damageAsteroid(closestAst, drillDmg);
      Effects.drillSpark(closestAst.x, closestAst.y);
      if (destroyed) {
        Effects.explosion(closestAst.x, closestAst.y, closestAst.radius / 25);
        this.camera.addShake(4);
      }
    }
  }

  // ── Collision detection ─────────────────────────────────────────────────────

  _checkCollisions() {
    const enemyShips = this.enemies.ships;

    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      if (!b.alive) continue;

      if (b.isPlayer) {
        let hit = false;
        for (const a of this.world.asteroids) {
          if (!a.alive) continue;
          const r = a.radius;
          if (dist2(b.x, b.y, a.x, a.y) < r * r) {
            const destroyed = this.world.damageAsteroid(a, b.damage);
            if (destroyed) { Effects.explosion(a.x, a.y, a.radius / 28); this.camera.addShake(3); }
            else             Effects.drillSpark(b.x, b.y);
            b.alive = false; hit = true; break;
          }
        }
        if (hit) continue;

        for (const ship of enemyShips) {
          if (!ship.alive) continue;
          const r = ship.radius + 6;
          if (dist2(b.x, b.y, ship.x, ship.y) < r * r) {
            const prev = ship.shieldHp;
            ship.damageAt(b.x, b.y, b.damage);
            if (prev > 0) Effects.shieldHit(b.x, b.y);
            else          Effects.explosion(b.x, b.y, 0.5);
            if (!ship.alive) Effects.explosion(ship.x, ship.y, 2.5);
            b.alive = false;
            break;
          }
        }
      } else {
        if (!this.player.alive) continue;
        const pr = this.player.radius + 6;
        if (dist2(b.x, b.y, this.player.x, this.player.y) < pr * pr) {
          const prev = this.player.shieldHp;
          this.player.damageAt(b.x, b.y, b.damage);
          if (prev > 0) { Effects.shieldHit(b.x, b.y); this.camera.addShake(4); }
          else          { Effects.explosion(b.x, b.y, 0.4); this.camera.addShake(9); }
          b.alive = false;
        }
      }
    }
  }

  // ── Screen transitions ──────────────────────────────────────────────────────

  _enterStation() {
    if (this._screen !== SCREEN.GAME) return;
    this._docked = true;
    this._screen = SCREEN.STATION;
    this._uiMgr.switchTo(SCREEN.STATION);
    this._stationUI.show();
  }

  _exitStation() {
    this._docked = false;
    this._stationUI.hide();
    this._uiMgr.switchTo(SCREEN.GAME);
    this._screen = SCREEN.GAME;
  }

  _enterBuild() {
    if (!this._docked) return; // dock required
    if (this._screen === SCREEN.BUILD) { this._exitBuild(); return; }
    this._stationUI.hide();
    this._screen = SCREEN.BUILD;
    this._buildUI.show();
  }

  _exitBuild() {
    this._screen = SCREEN.STATION;
    this._buildUI.hide();
    this.player.recalcStats();
    this._syncCargoCapacity();
    this.player.hp = Math.min(this.player.hp || this.player.stats.maxHp, this.player.stats.maxHp);
    this._stationUI.show();
  }

  _enterSettings() {
    if (this._screen === SCREEN.SETTINGS) {
      this._screen = SCREEN.GAME;
      this._uiMgr.switchTo(SCREEN.GAME);
    } else {
      this._screen = SCREEN.SETTINGS;
      this._uiMgr.switchTo(SCREEN.SETTINGS);
    }
  }

  _syncCargoCapacity() {
    if (this.player?.stats) {
      this.inventory.setCapacity(this.player.stats.cargoCapacity);
    }
  }

  _restart() {
    const ship = this.player;
    ship.blocks.clear();
    ship._statsDirty  = true;
    ship._spriteDirty = true;
    ship._sprite      = null;
    ship.x = -600; ship.y = 0;
    ship.vx = 0;   ship.vy = 0;
    ship.angle = 0; ship.av = 0;
    ship.alive = true;

    ship.addBlock(BID.CORE,      0,  0);
    ship.addBlock(BID.ARMOR,     0, -1);
    ship.addBlock(BID.ENGINE,   -2,  0);
    ship.addBlock(BID.WEAPON,    1,  0);
    ship.addBlock(BID.GENERATOR,-1,  1);
    ship.recalcStats();
    ship.hp       = ship.stats.maxHp;
    ship.shieldHp = 0;

    this.camera.x  = ship.x; this.camera.y  = ship.y;
    this.camera.tx = ship.x; this.camera.ty = ship.y;

    this._docked = false;
    this._screen = SCREEN.GAME;
    this._uiMgr.switchTo(SCREEN.GAME);
  }

  // ── Rendering ────────────────────────────────────────────────────────────────

  _render() {
    const ctx = this._ctx;
    const cw  = this._canvas.width;
    const ch  = this._canvas.height;

    ctx.fillStyle = C.BG;
    ctx.fillRect(0, 0, cw, ch);

    if (this._screen === SCREEN.BUILD) {
      this._buildUI.draw();
      return;
    }

    _drawStars(ctx, this.camera.x, this.camera.y, cw, ch);

    ctx.save();
    this.camera.apply(ctx);

    this.station.draw(ctx);
    this.world.drawAsteroids(ctx);
    this.world.drawDrops(ctx);
    drawBullets(ctx);
    this.enemies.draw(ctx);
    this.player.drawShield(ctx);
    this.player.draw(ctx);
    Effects.draw(ctx);

    ctx.restore();

    if (this._screen === SCREEN.GAME || this._screen === SCREEN.STATION) {
      this.hud.draw(ctx, cw, ch, this.player, this.inventory,
        this.camera, this.world, this.enemies, this.station, this.input);
    }
  }

  _resize() {
    this._canvas.width  = window.innerWidth;
    this._canvas.height = window.innerHeight;
  }
}

game.init().then(() => game.start());

  <script>
    (function() {
      function show(msg) {
        var el = document.getElementById('err-overlay');
        if (el) { el.style.display = 'block'; el.textContent += msg + '\n'; }
      }
      window.onerror = function(msg, src, line, col) {
        show('ERROR: ' + msg + '\n  at line ' + line);
        return false;
      };
      window.addEventListener('unhandledrejection', function(e) {
        show('PROMISE ERROR: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)));
      });
    })();
  </script>
